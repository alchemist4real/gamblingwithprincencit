<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#314fba">
  <title>EXAM MODE • GAMBLING WITH PRINCE NCIT</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23314fba'/%3E%3Cpath d='M32 12 C29 20 17 28 17 37 C17 43.5 22.5 47 28 45.8 C27 48.5 24.5 51 22 52 L42 52 C39.5 51 37 48.5 36 45.8 C41.5 47 47 43.5 47 37 C47 28 35 20 32 12 Z' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Special+Elite&display=swap" rel="stylesheet">
  <script src="packs/packs.js"></script>
  <style>
    /* =======================================================
       STRICT MONOCHROMATIC 2-COLOR DESIGN SYSTEM:
       PRIMARY BLUE #314fba & WHITE #ffffff
       ACCENT NAVY #172b7a
       FONTS: 'Special Elite' (Display) & 'Plus Jakarta Sans' (Body)
       TASTEFUL SPACING • ZERO OVERFLOW CLIPPING • ZERO COLLISION
       ======================================================= */

    :root {
      --primary: #314fba;
      --primary-dark: #223ca3;
      --primary-deep: #172b7a;
      --white: #ffffff;
      --white-90: rgba(255, 255, 255, 0.90);
      --white-75: rgba(255, 255, 255, 0.75);
      --white-50: rgba(255, 255, 255, 0.50);
      --white-25: rgba(255, 255, 255, 0.25);
      --white-15: rgba(255, 255, 255, 0.15);
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Special Elite', cursive, monospace, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    body, button, input, textarea, select {
      font-family: var(--font-main);
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--primary);
      color: var(--white);
      user-select: none;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: clamp(20px, 3.5vh, 40px) clamp(16px, 3vw, 36px) 100px;
      gap: clamp(16px, 2.5vh, 28px);
      box-sizing: border-box;
    }

    /* =======================================================
       CENTERED APP HEADER
       ======================================================= */
    header.app-header {
      text-align: center;
      width: 100%;
      max-width: 980px;
      flex-shrink: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    h1.main-title,
    h1.main-title *,
    .title-tone-1,
    .title-tone-2 {
      font-family: 'Special Elite', cursive, monospace, sans-serif !important;
    }

    h1.main-title {
      font-size: clamp(1.5rem, 3.4vw, 2.75rem);
      font-weight: normal;
      letter-spacing: clamp(1.5px, 0.4vw, 3px);
      text-transform: uppercase;
      line-height: 1.18;
      margin: 0;
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.5vw, 16px);
      color: var(--primary-deep);
      text-align: center;
      user-select: none;
    }

    .title-tone-1,
    .title-tone-2 {
      color: var(--primary-deep);
      -webkit-text-fill-color: var(--primary-deep);
      -webkit-text-stroke: 5px #ffffff;
      paint-order: stroke fill;
      text-shadow:
        -3px -3px 0 #ffffff,
         3px -3px 0 #ffffff,
        -3px  3px 0 #ffffff,
         3px  3px 0 #ffffff,
        -4px  0   0 #ffffff,
         4px  0   0 #ffffff,
         0   -4px 0 #ffffff,
         0    4px 0 #ffffff,
        -2px -3.5px 0 #ffffff,
          2px -3.5px 0 #ffffff,
        -2px  3.5px 0 #ffffff,
          2px  3.5px 0 #ffffff,
        -3.5px -2px 0 #ffffff,
          3.5px -2px 0 #ffffff,
        -3.5px  2px 0 #ffffff,
          3.5px  2px 0 #ffffff,
          0px  5px 0 rgba(19, 34, 96, 0.7),
          0px  8px 0 rgba(19, 34, 96, 0.4);
      display: inline-block;
      transition: transform 0.2s cubic-bezier(0.16, 1.2, 0.3, 1);
    }
    .title-tone-1:hover {
      transform: translateY(-2px) rotate(-1deg);
    }
    .title-tone-2:hover {
      transform: translateY(-2px) rotate(1deg);
    }

    .sub-meta {
      font-family: var(--font-main);
      font-size: clamp(0.72rem, 1.15vw, 0.84rem);
      font-weight: 700;
      color: var(--white-90);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: clamp(8px, 1.2vh, 12px);
      text-shadow: 0 1px 3px rgba(13, 26, 69, 0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 94vw;
    }

    @media (max-width: 600px) {
      h1.main-title {
        font-size: clamp(1.2rem, 5.5vw, 1.6rem);
        letter-spacing: 1.2px;
        gap: 6px;
      }
      .title-tone-1,
      .title-tone-2 {
        -webkit-text-stroke: 3.5px #ffffff;
      }
      .sub-meta {
        font-size: 0.68rem;
      }
    }

    /* =======================================================
       EXAM MAIN WRAPPER
       ======================================================= */
    main.exam-main-wrap {
      width: 100%;
      max-width: 1060px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-sizing: border-box;
      z-index: 5;
    }

    /* =======================================================
       PHASE 1: EXAM SETUP CONFIGURATION CARD
       ======================================================= */
    .exam-config-card {
      width: 100%;
      max-width: 720px;
      background-color: var(--white);
      border: 3px solid var(--primary-deep);
      border-radius: 20px;
      box-shadow: 0 6px 0 var(--primary-deep);
      padding: clamp(20px, 3vh, 32px);
      display: flex;
      flex-direction: column;
      gap: 20px;
      color: var(--primary-deep);
      box-sizing: border-box;
      animation: viewPop 0.22s ease-out;
    }
    @keyframes viewPop {
      0% { opacity: 0; transform: scale(0.97); }
      100% { opacity: 1; transform: scale(1); }
    }

    .config-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 2px solid #edf1fc;
    }
    .config-badge {
      font-family: var(--font-display);
      font-size: 11px;
      letter-spacing: 1.5px;
      background-color: var(--primary-deep);
      color: var(--white);
      padding: 4px 14px;
      border-radius: 999px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .config-card-close {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 2px solid var(--primary-deep);
      background-color: #f6f8fe;
      color: var(--primary-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .config-card-close:hover {
      background-color: var(--primary-deep);
      color: var(--white);
    }
    .config-card-close svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.4;
    }

    .config-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .config-section-title {
      font-family: var(--font-display);
      font-size: 11.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--primary-deep);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .config-pills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .config-pill-btn {
      padding: 8px 16px;
      border-radius: 999px;
      border: 2px solid var(--primary-deep);
      background-color: #f6f8fe;
      color: var(--primary-deep);
      font-family: var(--font-main);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.16s ease;
      user-select: none;
    }
    .config-pill-btn:hover {
      background-color: #edf2fd;
      transform: translateY(-1px);
    }
    .config-pill-btn.active {
      background-color: var(--primary-deep);
      color: var(--white);
      box-shadow: 0 3px 0 var(--primary);
    }

    .config-rules-box {
      background-color: #f6f8fe;
      border: 2px solid var(--primary-deep);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--primary-deep);
    }
    .rules-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .rules-bullet {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background-color: var(--primary);
      margin-top: 5px;
      flex-shrink: 0;
    }

    .btn-start-exam {
      width: 100%;
      height: 50px;
      border-radius: 999px;
      background-color: var(--primary-deep);
      color: var(--white);
      border: 2px solid var(--primary-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--primary);
      transition: all 0.18s ease;
      margin-top: 6px;
    }
    .btn-start-exam:hover {
      background-color: var(--primary);
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--primary-deep);
    }
    .btn-start-exam:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 var(--primary-deep);
    }
    .btn-start-exam svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.6;
    }

    /* =======================================================
       PHASE 2: 5S PREPARATION COUNTDOWN
       ======================================================= */
    .exam-prep-card {
      width: 100%;
      max-width: 600px;
      background-color: var(--white);
      border: 3px solid var(--primary-deep);
      border-radius: 20px;
      box-shadow: 0 6px 0 var(--primary-deep);
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      color: var(--primary-deep);
      box-sizing: border-box;
      animation: viewPop 0.2s ease-out;
    }
    .prep-countdown-circle {
      width: 100px;
      height: 100px;
      border-radius: 999px;
      background-color: var(--primary-deep);
      color: var(--white);
      border: 4px solid var(--white);
      box-shadow: 0 0 0 3px var(--primary-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 46px;
      font-weight: normal;
      animation: prepPulse 0.9s infinite alternate cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes prepPulse {
      0% { transform: scale(0.92); }
      100% { transform: scale(1.08); }
    }
    .prep-title {
      font-family: var(--font-display);
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--primary-deep);
    }
    .prep-sub {
      font-size: 13px;
      font-weight: 600;
      color: rgba(23, 43, 122, 0.75);
    }
    .btn-skip-prep {
      padding: 8px 22px;
      border-radius: 999px;
      border: 2px solid var(--primary-deep);
      background-color: #f6f8fe;
      color: var(--primary-deep);
      font-family: var(--font-display);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      transition: all 0.16s ease;
    }
    .btn-skip-prep:hover {
      background-color: var(--primary-deep);
      color: var(--white);
      transform: scale(1.04);
    }

    /* =======================================================
       PHASE 3: 60S TIMED STUDY PHASE (SPLIT LAYOUT)
       ======================================================= */
    .study-top-hud {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background-color: var(--white);
      border: 3px solid var(--primary-deep);
      border-radius: 999px;
      padding: 6px 16px;
      box-shadow: 0 4px 0 var(--primary-deep);
      color: var(--primary-deep);
      box-sizing: border-box;
    }
    .hud-specimen-pill {
      font-family: var(--font-display);
      font-size: 12px;
      letter-spacing: 1.5px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .hud-timer-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #f6f8fe;
      border: 2px solid var(--primary-deep);
      border-radius: 999px;
      padding: 3px 12px 3px 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .hud-timer-wrap:hover {
      background-color: #edf2fd;
      transform: scale(1.03);
    }
    .timer-svg-box {
      width: 22px;
      height: 22px;
      transform: rotate(-90deg);
    }
    .timer-circle-bg {
      fill: none;
      stroke: #d0d8f0;
      stroke-width: 3;
    }
    .timer-circle-bar {
      fill: none;
      stroke: var(--primary-deep);
      stroke-width: 3;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.9s linear;
    }
    .hud-timer-text {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .hud-reveal-btn {
      padding: 6px 16px;
      border-radius: 999px;
      background-color: var(--primary-deep);
      color: var(--white);
      border: 2px solid var(--primary-deep);
      font-family: var(--font-display);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.16s ease;
    }
    .hud-reveal-btn:hover {
      background-color: var(--primary);
      border-color: var(--primary);
      transform: scale(1.04);
    }
    .hud-reveal-btn svg {
      width: 13px;
      height: 13px;
      stroke-width: 2.5;
    }

    /* Study Workspace Grid */
    .study-workspace-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 20px;
      align-items: stretch;
      box-sizing: border-box;
    }

    /* Specimen Visual Card */
    .study-visual-card {
      background-color: #0d1a45;
      border: 3px solid var(--primary-deep);
      border-radius: 20px;
      box-shadow: 0 5px 0 var(--primary-deep);
      overflow: hidden;
      min-height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .study-visual-img {
      width: 100%;
      height: 100%;
      max-height: 480px;
      object-fit: contain;
      background-color: #060c22;
      display: block;
    }
    .study-vignette-box {
      padding: 24px;
      color: var(--white);
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }
    .study-vignette-badge {
      font-family: var(--font-display);
      font-size: 10px;
      letter-spacing: 1.5px;
      background-color: var(--white);
      color: var(--primary-deep);
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 700;
      align-self: flex-start;
      text-transform: uppercase;
    }
    .study-vignette-text {
      font-size: 13.5px;
      line-height: 1.5;
      color: #eef3ff;
      font-weight: 500;
    }

    /* 4 Universal Prompts Card */
    .study-prompts-card {
      background-color: var(--white);
      border: 3px solid var(--primary-deep);
      border-radius: 20px;
      box-shadow: 0 5px 0 var(--primary-deep);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: var(--primary-deep);
      box-sizing: border-box;
    }

    .prompts-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 2px solid #edf1fc;
    }
    .prompts-card-title {
      font-family: var(--font-display);
      font-size: 11.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--primary-deep);
    }

    .prompt-box {
      background-color: #f6f8fe;
      border: 2px solid var(--primary-deep);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .prompt-box-badge {
      font-family: var(--font-display);
      font-size: 9px;
      letter-spacing: 1px;
      background-color: var(--primary-deep);
      color: var(--white);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
      align-self: flex-start;
      text-transform: uppercase;
    }
    .prompt-box-text {
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      color: var(--primary-deep);
    }

    @media (max-width: 820px) {
      .study-workspace-grid {
        grid-template-columns: 1fr;
      }
      .study-visual-card {
        min-height: 260px;
      }
    }

    /* =======================================================
       PHASE 4: STRUCTURED REVEAL PHASE
       ======================================================= */
    .reveal-workspace-card {
      width: 100%;
      background-color: var(--white);
      border: 3px solid var(--primary-deep);
      border-radius: 20px;
      box-shadow: 0 6px 0 var(--primary-deep);
      padding: clamp(18px, 2.8vh, 26px);
      display: flex;
      flex-direction: column;
      gap: 16px;
      color: var(--primary-deep);
      box-sizing: border-box;
      animation: viewPop 0.22s ease-out;
    }

    .reveal-header-bar {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-bottom: 12px;
      border-bottom: 2px solid #edf1fc;
    }
    .reveal-title-badge {
      font-family: var(--font-display);
      font-size: 10px;
      letter-spacing: 1.5px;
      background-color: var(--primary-deep);
      color: var(--white);
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 700;
      align-self: flex-start;
      text-transform: uppercase;
    }
    .reveal-main-title {
      font-family: var(--font-display);
      font-size: clamp(1.3rem, 2.6vw, 1.8rem);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--primary-deep);
      line-height: 1.2;
    }
    .reveal-tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .reveal-tag {
      font-size: 11.5px;
      font-weight: 700;
      background-color: #f6f8fe;
      border: 1.5px solid var(--primary-deep);
      border-radius: 6px;
      padding: 3px 10px;
      color: var(--primary-deep);
    }

    /* Reveal Split Layout (Specimen Visual + Diagnostic Findings) */
    .reveal-split-layout {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 16px;
      align-items: start;
    }

    .reveal-visual-card {
      background-color: #0d1a45;
      border: 2px solid var(--primary-deep);
      border-radius: 14px;
      overflow: hidden;
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .reveal-visual-img {
      width: 100%;
      height: 100%;
      max-height: 380px;
      object-fit: contain;
      background-color: #060c22;
      display: block;
    }

    .reveal-details-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .reveal-info-box {
      background-color: #f6f8fe;
      border: 2px solid var(--primary-deep);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .reveal-info-title {
      font-family: var(--font-display);
      font-size: 10.5px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--primary-deep);
      font-weight: 700;
    }
    .reveal-info-content {
      font-size: 12px;
      line-height: 1.45;
      color: var(--primary-deep);
    }
    .reveal-bullet-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .reveal-bullet-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .reveal-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background-color: var(--primary-deep);
      margin-top: 5px;
      flex-shrink: 0;
    }

    @media (max-width: 820px) {
      .reveal-split-layout {
        grid-template-columns: 1fr;
      }
      .reveal-visual-card {
        min-height: 200px;
      }
    }

    /* Scoring Section */
    .reveal-scoring-box {
      background-color: var(--primary-deep);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--white);
    }
    .scoring-label-text {
      font-family: var(--font-display);
      font-size: 11.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .scoring-btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-score-pick {
      padding: 8px 18px;
      border-radius: 999px;
      border: 2px solid var(--white);
      background-color: var(--white);
      color: var(--primary-deep);
      font-family: var(--font-main);
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.16s ease;
      user-select: none;
    }
    .btn-score-pick:hover {
      background-color: var(--primary);
      color: var(--white);
      transform: scale(1.05);
    }

    /* =======================================================
       PHASE 5: PERFORMANCE SUMMARY SCORECARD
       ======================================================= */
    .exam-summary-card {
      width: 100%;
      max-width: 640px;
      background-color: var(--white);
      border: 3px solid var(--primary-deep);
      border-radius: 20px;
      box-shadow: 0 6px 0 var(--primary-deep);
      padding: 36px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      color: var(--primary-deep);
      box-sizing: border-box;
      animation: viewPop 0.22s ease-out;
    }

    .summary-score-badge {
      width: 110px;
      height: 110px;
      border-radius: 999px;
      background-color: var(--primary-deep);
      color: var(--white);
      border: 4px solid var(--white);
      box-shadow: 0 0 0 3px var(--primary-deep);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 36px;
      line-height: 1;
    }
    .summary-score-sub {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-top: 3px;
    }

    .summary-title {
      font-family: var(--font-display);
      font-size: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--primary-deep);
    }

    .summary-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 480px;
    }
    .summary-stat-item {
      background-color: #f6f8fe;
      border: 2px solid var(--primary-deep);
      border-radius: 10px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .summary-stat-val {
      font-family: var(--font-display);
      font-size: 20px;
      color: var(--primary-deep);
    }
    .summary-stat-lbl {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: rgba(23, 43, 122, 0.75);
      text-transform: uppercase;
    }

    .summary-actions-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .btn-summary-action {
      padding: 10px 24px;
      border-radius: 999px;
      border: 2px solid var(--primary-deep);
      background-color: var(--primary-deep);
      color: var(--white);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.16s ease;
    }
    .btn-summary-action:hover {
      background-color: var(--primary);
      border-color: var(--primary);
      transform: scale(1.04);
    }

    /* =======================================================
       SOLID & CONSOLIDATED CONSOLE DOCK (MATCHING CASUAL.HTML)
       ======================================================= */
    .bottom-player-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: auto;
      max-width: fit-content;
      height: 56px;
      border: 3px solid var(--primary-deep);
      border-radius: 999px;
      background-color: var(--white);
      padding: 5px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 0 var(--primary-deep);
      z-index: 1000;
    }

    .dock-section {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .dock-round-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 999px;
      border: 2px solid var(--primary-deep);
      background-color: #f6f8fe;
      color: var(--primary-deep);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
    }
    .dock-round-btn:hover {
      background-color: var(--primary-deep);
      color: var(--white);
      transform: scale(1.08);
    }
    .dock-round-btn svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.2;
    }
    .dock-round-btn.is-muted {
      opacity: 0.65;
      border-style: dashed;
    }

    .dock-track-info {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 14px;
      background-color: #f6f8fe;
      border: 2px solid var(--primary-deep);
      border-radius: 999px;
      user-select: none;
    }
    .dock-track-count {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--primary-deep);
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .dock-pill-btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      border: 2px solid var(--primary-deep);
      background-color: #f6f8fe;
      color: var(--primary-deep);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }
    .dock-pill-btn:hover {
      background-color: var(--primary-deep);
      color: var(--white);
      transform: scale(1.04);
    }
    .dock-pill-btn svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.2;
    }

    /* =======================================================
       TOAST SYSTEM
       ======================================================= */
    .toast-container {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      width: 90%;
      max-width: 440px;
    }
    .toast-pill {
      background-color: var(--white);
      color: var(--primary-deep);
      border: 2.5px solid var(--primary-deep);
      box-shadow: 0 4px 0 var(--primary-deep);
      border-radius: 999px;
      padding: 8px 18px;
      font-family: var(--font-main);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(-12px);
      transition: all 0.22s cubic-bezier(0.16, 1.25, 0.3, 1);
      pointer-events: auto;
    }
    .toast-pill.active {
      opacity: 1;
      transform: translateY(0);
    }
    .toast-pill svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.4;
      color: var(--primary);
    }
  </style>
</head>
<body>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- CENTERED APP HEADER -->
  <header class="app-header">
    <div class="title-row">
      <h1 class="main-title">
        <span class="title-tone-1">EXAM MODE</span>
        <span class="title-tone-2">PRINCE NCIT</span>
      </h1>
    </div>
    <div class="sub-meta" id="examSubMeta">PRACTICAL EXAM SIMULATION // 60S SPECIMEN IDENTIFICATION</div>
  </header>

  <!-- MAIN EXAM WRAPPER -->
  <main class="exam-main-wrap" id="examMainWrap">
    <!-- Dynamically rendered by renderCurrentPhase() -->
  </main>

  <!-- SOLID & CONSOLIDATED CONSOLE DOCK -->
  <footer class="bottom-player-bar">
    <div class="dock-section dock-left">
      <a href="index.html" class="dock-round-btn" id="btnDockLobby" title="Return to Lobby [Esc]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </a>
      <button class="dock-round-btn" id="btnAudioToggle" onclick="toggleAudioMute()" title="Toggle Sound [M]">
        <svg id="iconAudioOn" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        <svg id="iconAudioOff" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="23" y1="9" x2="17" y2="15"/>
          <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>
    </div>

    <div class="dock-section dock-center">
      <div class="dock-track-info">
        <span class="dock-track-count" id="dockExamStatus">EXAM CONFIGURATION</span>
      </div>
    </div>

    <div class="dock-section dock-right" id="dockActionGroup">
      <!-- Contextual Action Button -->
    </div>
  </footer>

  <!-- EXAM ENGINE JAVASCRIPT -->
  <script>
    let selectedPackIds = [];
    let ALL_EXAM_CARDS = [];
    let examActiveFilter = 'all';
    let examTargetCount = 20;

    // Phases: 'setup', 'prep', 'study', 'reveal', 'summary'
    let currentExamPhase = 'setup';
    let examSessionCards = [];
    let currentCardIndex = 0;
    let prepTimer = null;
    let prepRemaining = 5;
    let studyTimer = null;
    let studyRemaining = 60;
    let isTimerPaused = false;

    // Scoring
    let examScores = {
      mastered: 0,
      partial: 0,
      missed: 0,
      totalPoints: 0
    };

    // Audio & Toast
    let isAudioMuted = false;
    let audioCtx = null;
    let toastTimer = null;

    function initExamEngine() {
      const packs = window.CARD_PACKS || {};
      const allPackKeys = Object.keys(packs);

      try {
        const stored = localStorage.getItem('selectedCardPacks');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) {
            selectedPackIds = parsed.filter(id => packs[id]);
          }
        }
      } catch (e) {}

      if (!selectedPackIds || selectedPackIds.length === 0) {
        selectedPackIds = allPackKeys.length > 0 ? [...allPackKeys] : [];
      }

      // Merge cards from selected packs
      let combined = [];
      selectedPackIds.forEach(pId => {
        const p = packs[pId];
        if (p && p.cards) {
          p.cards.forEach(c => {
            combined.push({
              ...c,
              _packId: pId,
              _packName: p.packName || pId,
              _packBadge: p.badge || 'PACK'
            });
          });
        }
      });

      ALL_EXAM_CARDS = combined;

      // Update Sub-Meta
      const subMeta = document.getElementById('examSubMeta');
      if (subMeta) {
        const packNames = selectedPackIds.map(id => packs[id]?.badge || packs[id]?.packName || id).join(' + ');
        subMeta.textContent = `${packNames || 'EXAM SIMULATION'} // ${ALL_EXAM_CARDS.length} SPECIMENS READY`;
      }

      renderCurrentPhase();
    }

    // =======================================================
    // PHASE RENDER ROUTER
    // =======================================================
    function renderCurrentPhase() {
      const wrap = document.getElementById('examMainWrap');
      if (!wrap) return;

      if (currentExamPhase === 'setup') {
        renderSetupPhase(wrap);
      } else if (currentExamPhase === 'prep') {
        renderPrepPhase(wrap);
      } else if (currentExamPhase === 'study') {
        renderStudyPhase(wrap);
      } else if (currentExamPhase === 'reveal') {
        renderRevealPhase(wrap);
      } else if (currentExamPhase === 'summary') {
        renderSummaryPhase(wrap);
      }

      updateDockUI();
    }

    // 1. SETUP PHASE
    function renderSetupPhase(container) {
      const prepCount = ALL_EXAM_CARDS.filter(c => c.type === 'preparat').length;
      const teoriCount = ALL_EXAM_CARDS.filter(c => c.type === 'teori').length;
      const totalCount = ALL_EXAM_CARDS.length;

      container.innerHTML = `
        <div class="exam-config-card">
          <div class="config-card-header">
            <span class="config-badge">EXAM CONFIGURATION</span>
            <a href="index.html" class="config-card-close" title="Return to Lobby [Esc]">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </a>
          </div>

          <!-- Filter Section -->
          <div class="config-section">
            <div class="config-section-title">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
              <span>1. CONTENT FILTER</span>
            </div>
            <div class="config-pills-row">
              <button class="config-pill-btn ${examActiveFilter === 'all' ? 'active' : ''}" onclick="setExamFilter('all')">
                <span>All Questions (${totalCount})</span>
              </button>
              <button class="config-pill-btn ${examActiveFilter === 'preparat' ? 'active' : ''}" onclick="setExamFilter('preparat')">
                <span>Histopathology (${prepCount})</span>
              </button>
              <button class="config-pill-btn ${examActiveFilter === 'teori' ? 'active' : ''}" onclick="setExamFilter('teori')">
                <span>Theory & Cases (${teoriCount})</span>
              </button>
            </div>
          </div>

          <!-- Question Count Section -->
          <div class="config-section">
            <div class="config-section-title">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span>2. QUESTION COUNT</span>
            </div>
            <div class="config-pills-row">
              <button class="config-pill-btn ${examTargetCount === 5 ? 'active' : ''}" onclick="setExamCount(5)">
                <span>5 Questions</span>
              </button>
              <button class="config-pill-btn ${examTargetCount === 10 ? 'active' : ''}" onclick="setExamCount(10)">
                <span>10 Questions</span>
              </button>
              <button class="config-pill-btn ${examTargetCount === 20 ? 'active' : ''}" onclick="setExamCount(20)">
                <span>20 Questions</span>
              </button>
              <button class="config-pill-btn ${examTargetCount === 'all' ? 'active' : ''}" onclick="setExamCount('all')">
                <span>All (${totalCount})</span>
              </button>
            </div>
          </div>

          <!-- Protocol Rules -->
          <div class="config-section">
            <div class="config-section-title">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
              <span>3. SIMULATION RULES</span>
            </div>
            <div class="config-rules-box">
              <div class="rules-item">
                <div class="rules-bullet"></div>
                <div><strong>5s Countdown Preparation:</strong> Brief preparation phase before each specimen is displayed.</div>
              </div>
              <div class="rules-item">
                <div class="rules-bullet"></div>
                <div><strong>60s Timed Identification:</strong> Analyze the high-resolution specimen and answer 4 general practical questions.</div>
              </div>
              <div class="rules-item">
                <div class="rules-bullet"></div>
                <div><strong>Structured Reveal & Scoring:</strong> Immediate diagnostic answer, microscopic findings, and self-assessment scorecard.</div>
              </div>
            </div>
          </div>

          <button class="btn-start-exam" onclick="startExamSession()">
            <span>START EXAM SIMULATION [Enter]</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      `;
    }

    // 2. PREPARATION COUNTDOWN PHASE (5S)
    function renderPrepPhase(container) {
      container.innerHTML = `
        <div class="exam-prep-card">
          <div class="prep-countdown-circle" id="prepCounterEl">${prepRemaining}</div>
          <div class="prep-title">PREPARE FOR SPECIMEN #${currentCardIndex + 1}</div>
          <div class="prep-sub">Specimen identification begins in ${prepRemaining} seconds...</div>
          <button class="btn-skip-prep" onclick="skipPrepToStudy()">
            <span>SKIP PREPARATION [Enter]</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      `;
    }

    // 3. STUDY PHASE (60S) WITH 4 UNIVERSAL QUESTIONS
    function renderStudyPhase(container) {
      const card = examSessionCards[currentCardIndex] || {};
      const total = examSessionCards.length;
      const progressOffset = ((60 - studyRemaining) / 60) * 56.5;

      container.innerHTML = `
        <!-- Top HUD -->
        <div class="study-top-hud">
          <span class="hud-specimen-pill">SPECIMEN ${currentCardIndex + 1} OF ${total}</span>
          
          <div class="hud-timer-wrap" id="studyTimerWrap" title="Pause / Resume [Space]" onclick="toggleStudyTimerPause()">
            <svg class="timer-svg-box" viewBox="0 0 24 24">
              <circle class="timer-circle-bg" cx="12" cy="12" r="9"/>
              <circle class="timer-circle-bar" id="timerCircleBar" cx="12" cy="12" r="9" stroke-dasharray="56.5" stroke-dashoffset="${progressOffset}"/>
            </svg>
            <span class="hud-timer-text" id="studySecondsEl">${studyRemaining}s</span>
          </div>

          <button class="hud-reveal-btn" onclick="revealCurrentAnswer()">
            <span>REVEAL [Enter]</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>

        <!-- Main Workspace -->
        <div class="study-workspace-grid">
          
          <!-- Left: Specimen High-Res Visual -->
          <div class="study-visual-card">
            ${card.image ? `
              <img src="${card.image}" alt="Specimen ${card.id}" class="study-visual-img" />
            ` : `
              <div class="study-vignette-box">
                <span class="study-vignette-badge">THEORETICAL VIGNETTE</span>
                <p class="study-vignette-text">${card.prompt || 'Observe case scenario and pathological findings.'}</p>
              </div>
            `}
          </div>

          <!-- Right: The 4 Universal Practical Prompts -->
          <div class="study-prompts-card">
            <div class="prompts-card-header">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              <span class="prompts-card-title">PRACTICAL EXAM QUESTIONS</span>
            </div>

            <div class="prompt-box">
              <span class="prompt-box-badge">SOAL 1 // IDENTIFIKASI</span>
              <div class="prompt-box-text">Preparat apa ini? Tentukan nama sediaan / diagnosis patologi.</div>
            </div>

            <div class="prompt-box">
              <span class="prompt-box-badge">SOAL 2 // STRUKTUR KHAS</span>
              <div class="prompt-box-text">Sel apa yang menjadi ciri khas pada struktur ini? Sebutkan penanda mikroskopisnya.</div>
            </div>

            <div class="prompt-box">
              <span class="prompt-box-badge">SOAL 3 // CIRI UTAMA</span>
              <div class="prompt-box-text">Apa ciri-ciri utama sediaan ini? Deskripsikan pola arsitektur atau stroma.</div>
            </div>

            <div class="prompt-box">
              <span class="prompt-box-badge">SOAL 4 // BIOLOGIS & PATOFISIOLOGI</span>
              <div class="prompt-box-text">Fungsi atau signifikansi biologis / patogenesis apa yang mendasari kelainan ini?</div>
            </div>
          </div>

        </div>
      `;
    }

    // 4. STRUCTURED REVEAL PHASE
    function renderRevealPhase(container) {
      const card = examSessionCards[currentCardIndex] || {};
      const total = examSessionCards.length;

      const rawCiri = card.struktur_khas || card.ciri_kunci || card.mikroskopis || [];
      const ciriList = Array.isArray(rawCiri) ? rawCiri : [rawCiri];

      const rawEtiologi = card.etiologi || card.mekanisme || '';
      const etiologiText = Array.isArray(rawEtiologi) ? rawEtiologi.join(' • ') : rawEtiologi;

      container.innerHTML = `
        <div class="reveal-workspace-card">
          
          <!-- Diagnosis Header -->
          <div class="reveal-header-bar">
            <span class="reveal-title-badge">SPECIMEN #${currentCardIndex + 1} OF ${total} // DIAGNOSIS RESMI</span>
            <h2 class="reveal-main-title">${card.diagnosis || 'Diagnosis Sediaan'}</h2>
            <div class="reveal-tags-row">
              <span class="reveal-tag">📍 Organ: ${card.organ || '-'}</span>
              <span class="reveal-tag">🏷️ Sifat: ${card.sifat || '-'}</span>
              ${card.asal ? `<span class="reveal-tag">🔬 Asal: ${card.asal}</span>` : ''}
              ${card._packBadge ? `<span class="reveal-tag">📦 Deck: ${card._packBadge}</span>` : ''}
            </div>
          </div>

          <!-- Split Visual & Details -->
          <div class="reveal-split-layout">
            <!-- Left: Specimen Visual -->
            <div class="reveal-visual-card">
              ${card.image ? `
                <img src="${card.image}" alt="Specimen ${card.id}" class="reveal-visual-img" />
              ` : `
                <div class="study-vignette-box" style="padding: 20px;">
                  <span class="study-vignette-badge">THEORETICAL VIGNETTE</span>
                  <p class="study-vignette-text">${card.prompt || 'Theoretical question and case analysis.'}</p>
                </div>
              `}
            </div>

            <!-- Right: Details & High-Yield Findings -->
            <div class="reveal-details-col">
              <div class="reveal-info-box">
                <span class="reveal-info-title">CIRI KHAS HISTOPATOLOGIS</span>
                <ul class="reveal-bullet-list">
                  ${ciriList.map(item => `
                    <li class="reveal-bullet-item">
                      <div class="reveal-dot"></div>
                      <div class="reveal-info-content">${item}</div>
                    </li>
                  `).join('')}
                </ul>
              </div>

              ${etiologiText ? `
                <div class="reveal-info-box">
                  <span class="reveal-info-title">ETIOLOGI &amp; PATOFISIOLOGI</span>
                  <div class="reveal-info-content">${etiologiText}</div>
                </div>
              ` : ''}

              ${card.keywords ? `
                <div class="reveal-info-box">
                  <span class="reveal-info-title">KATA KUNCI IDENTIFIKASI</span>
                  <div class="reveal-info-content"><strong>${card.keywords}</strong></div>
                </div>
              ` : ''}
            </div>
          </div>

          <!-- Self-Assessment Scoring Choice -->
          <div class="reveal-scoring-box">
            <span class="scoring-label-text">EVALUASI PEMAHAMAN ANDA:</span>
            <div class="scoring-btn-group">
              <button class="btn-score-pick" onclick="recordScoreAndNext('missed')" title="Key [1]">
                <span>0 • MISSED [1]</span>
              </button>
              <button class="btn-score-pick" onclick="recordScoreAndNext('partial')" title="Key [2]">
                <span>1 • PARTIAL [2]</span>
              </button>
              <button class="btn-score-pick" onclick="recordScoreAndNext('mastered')" title="Key [3]">
                <span>2 • MASTERED [3]</span>
              </button>
            </div>
          </div>

        </div>
      `;
    }

    // 5. SUMMARY PHASE
    function renderSummaryPhase(container) {
      const totalCards = examSessionCards.length;
      const maxPoints = totalCards * 2;
      const pct = maxPoints > 0 ? Math.round((examScores.totalPoints / maxPoints) * 100) : 0;

      container.innerHTML = `
        <div class="exam-summary-card">
          <div class="summary-score-badge">
            <span>${pct}%</span>
            <span class="summary-score-sub">${examScores.totalPoints}/${maxPoints} PTS</span>
          </div>
          <h2 class="summary-title">SIMULATION COMPLETE</h2>
          
          <div class="summary-stats-grid">
            <div class="summary-stat-item">
              <span class="summary-stat-val">${examScores.mastered}</span>
              <span class="summary-stat-lbl">Mastered (100%)</span>
            </div>
            <div class="summary-stat-item">
              <span class="summary-stat-val">${examScores.partial}</span>
              <span class="summary-stat-lbl">Partial (50%)</span>
            </div>
            <div class="summary-stat-item">
              <span class="summary-stat-val">${examScores.missed}</span>
              <span class="summary-stat-lbl">Missed (0%)</span>
            </div>
          </div>

          <div class="summary-actions-row">
            <button class="btn-summary-action" onclick="restartExamSimulation()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              <span>REPLAY SIMULATION</span>
            </button>
            <a href="index.html" class="btn-summary-action" style="background-color: var(--primary);">
              <span>RETURN TO LOBBY [Esc]</span>
            </a>
          </div>
        </div>
      `;
    }

    // =======================================================
    // EXAM INTERACTIONS & TIMERS
    // =======================================================
    function setExamFilter(filterType) {
      playClickSound();
      examActiveFilter = filterType;
      renderCurrentPhase();
    }

    function setExamCount(countVal) {
      playClickSound();
      examTargetCount = countVal;
      renderCurrentPhase();
    }

    function startExamSession() {
      playLaunchSound();
      let pool = [];
      if (examActiveFilter === 'all') {
        pool = [...ALL_EXAM_CARDS];
      } else {
        pool = ALL_EXAM_CARDS.filter(c => c.type === examActiveFilter);
      }

      if (pool.length === 0) {
        showToast('Notice', 'No specimens match the chosen filter.');
        playErrorSound();
        return;
      }

      pool = shuffleArray(pool);

      if (examTargetCount !== 'all' && typeof examTargetCount === 'number') {
        examSessionCards = pool.slice(0, examTargetCount);
      } else {
        examSessionCards = pool;
      }

      currentCardIndex = 0;
      examScores = { mastered: 0, partial: 0, missed: 0, totalPoints: 0 };

      showToast('Exam Started', `${examSessionCards.length} specimens queued.`);
      startPrepCountdown();
    }

    function startPrepCountdown() {
      currentExamPhase = 'prep';
      prepRemaining = 5;
      renderCurrentPhase();
      playTickSound();

      if (prepTimer) clearInterval(prepTimer);
      prepTimer = setInterval(() => {
        prepRemaining--;
        if (prepRemaining > 0) {
          playTickSound();
          const el = document.getElementById('prepCounterEl');
          if (el) el.textContent = prepRemaining;
        } else {
          clearInterval(prepTimer);
          prepTimer = null;
          startStudyCountdown();
        }
      }, 1000);
    }

    function skipPrepToStudy() {
      if (prepTimer) clearInterval(prepTimer);
      prepTimer = null;
      startStudyCountdown();
    }

    function startStudyCountdown() {
      currentExamPhase = 'study';
      studyRemaining = 60;
      isTimerPaused = false;
      renderCurrentPhase();
      playTone(520, 'sine', 0.12);

      if (studyTimer) clearInterval(studyTimer);
      studyTimer = setInterval(() => {
        if (isTimerPaused) return;

        studyRemaining--;
        const secEl = document.getElementById('studySecondsEl');
        const progressEl = document.getElementById('timerCircleBar');
        if (secEl) secEl.textContent = `${studyRemaining}s`;
        if (progressEl) {
          const offset = ((60 - studyRemaining) / 60) * 56.5;
          progressEl.setAttribute('stroke-dashoffset', offset);
        }

        if (studyRemaining <= 5 && studyRemaining > 0) {
          playWarningTick();
        }

        if (studyRemaining <= 0) {
          clearInterval(studyTimer);
          studyTimer = null;
          revealCurrentAnswer();
        }
      }, 1000);
    }

    function toggleStudyTimerPause() {
      isTimerPaused = !isTimerPaused;
      showToast('Timer', isTimerPaused ? 'Timer Paused' : 'Timer Resumed');
      const box = document.getElementById('studyTimerWrap');
      if (box) {
        box.style.opacity = isTimerPaused ? '0.6' : '1';
      }
    }

    function revealCurrentAnswer() {
      if (studyTimer) clearInterval(studyTimer);
      studyTimer = null;
      playRevealSound();
      currentExamPhase = 'reveal';
      renderCurrentPhase();
    }

    function recordScoreAndNext(choice) {
      playSelectSound();
      if (choice === 'mastered') {
        examScores.mastered++;
        examScores.totalPoints += 2;
      } else if (choice === 'partial') {
        examScores.partial++;
        examScores.totalPoints += 1;
      } else {
        examScores.missed++;
      }

      currentCardIndex++;
      if (currentCardIndex < examSessionCards.length) {
        startPrepCountdown();
      } else {
        finishExamSession();
      }
    }

    function finishExamSession() {
      currentExamPhase = 'summary';
      playChimeSound();
      renderCurrentPhase();
    }

    function restartExamSimulation() {
      currentExamPhase = 'setup';
      renderCurrentPhase();
    }

    function updateDockUI() {
      const statusEl = document.getElementById('dockExamStatus');
      const actionGroup = document.getElementById('dockActionGroup');
      if (!statusEl || !actionGroup) return;

      if (currentExamPhase === 'setup') {
        statusEl.textContent = 'EXAM CONFIGURATION';
        actionGroup.innerHTML = `
          <button class="dock-pill-btn" onclick="startExamSession()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span>START [Enter]</span>
          </button>
        `;
      } else if (currentExamPhase === 'prep') {
        statusEl.textContent = `PREPARING: ${currentCardIndex + 1} / ${examSessionCards.length}`;
        actionGroup.innerHTML = `
          <button class="dock-pill-btn" onclick="skipPrepToStudy()">
            <span>SKIP PREP [Enter]</span>
          </button>
        `;
      } else if (currentExamPhase === 'study') {
        statusEl.textContent = `STUDYING: ${currentCardIndex + 1} / ${examSessionCards.length} (${studyRemaining}s)`;
        actionGroup.innerHTML = `
          <button class="dock-pill-btn" onclick="revealCurrentAnswer()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"/></svg>
            <span>REVEAL [Enter]</span>
          </button>
        `;
      } else if (currentExamPhase === 'reveal') {
        statusEl.textContent = `REVEALED: ${currentCardIndex + 1} / ${examSessionCards.length}`;
        actionGroup.innerHTML = `
          <button class="dock-pill-btn" onclick="recordScoreAndNext('mastered')">
            <span>NEXT [Enter]</span>
          </button>
        `;
      } else if (currentExamPhase === 'summary') {
        statusEl.textContent = 'SIMULATION FINISHED';
        actionGroup.innerHTML = `
          <button class="dock-pill-btn" onclick="restartExamSimulation()">
            <span>REPLAY [Enter]</span>
          </button>
        `;
      }
    }

    function shuffleArray(arr) {
      const clone = [...arr];
      for (let i = clone.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [clone[i], clone[j]] = [clone[j], clone[i]];
      }
      return clone;
    }

    // =======================================================
    // AUDIO SYNTHESIZER
    // =======================================================
    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleAudioMute() {
      isAudioMuted = !isAudioMuted;
      try {
        localStorage.setItem('audioMuted', isAudioMuted ? 'true' : 'false');
      } catch (e) {}
      updateAudioIconUI();
      if (!isAudioMuted) {
        initAudioContext();
        playSelectSound();
        showToast('Audio', 'Sound Effects Enabled');
      } else {
        showToast('Audio', 'Sound Effects Muted');
      }
    }

    function updateAudioIconUI() {
      const onIcon = document.getElementById('iconAudioOn');
      const offIcon = document.getElementById('iconAudioOff');
      const btn = document.getElementById('btnAudioToggle');
      if (onIcon && offIcon) {
        onIcon.style.display = isAudioMuted ? 'none' : 'block';
        offIcon.style.display = isAudioMuted ? 'block' : 'none';
      }
      if (btn) {
        btn.classList.toggle('is-muted', isAudioMuted);
      }
    }

    function playTone(freq, type, duration) {
      if (isAudioMuted) return;
      initAudioContext();
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playClickSound() {
      playTone(620, 'triangle', 0.05);
    }

    function playSelectSound() {
      playTone(880, 'sine', 0.08);
    }

    function playLaunchSound() {
      playTone(720, 'triangle', 0.16);
    }

    function playTickSound() {
      playTone(440, 'triangle', 0.04);
    }

    function playWarningTick() {
      playTone(330, 'sawtooth', 0.07);
    }

    function playRevealSound() {
      playTone(660, 'sine', 0.14);
    }

    function playChimeSound() {
      playTone(659, 'sine', 0.10);
      setTimeout(() => playTone(987, 'sine', 0.16), 80);
    }

    function playErrorSound() {
      playTone(160, 'sawtooth', 0.14);
    }

    // =======================================================
    // TOAST SYSTEM
    // =======================================================
    function showToast(title, message) {
      const container = document.getElementById('toastContainer');
      if (!container) return;

      container.innerHTML = `
        <div class="toast-pill active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
          <span><strong>${title}:</strong> ${message}</span>
        </div>
      `;

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        container.innerHTML = '';
      }, 2400);
    }

    // =======================================================
    // KEYBOARD SHORTCUTS
    // =======================================================
    window.addEventListener('keydown', (e) => {
      // Esc: Return to Lobby
      if (e.key === 'Escape') {
        e.preventDefault();
        window.location.href = 'index.html';
        return;
      }

      // M: Audio Mute
      if (e.key === 'm' || e.key === 'M') {
        e.preventDefault();
        toggleAudioMute();
        return;
      }

      // Enter
      if (e.key === 'Enter') {
        e.preventDefault();
        if (currentExamPhase === 'setup') startExamSession();
        else if (currentExamPhase === 'prep') skipPrepToStudy();
        else if (currentExamPhase === 'study') revealCurrentAnswer();
        else if (currentExamPhase === 'reveal') recordScoreAndNext('mastered');
        else if (currentExamPhase === 'summary') restartExamSimulation();
        return;
      }

      // Space: Pause/Resume Study Timer
      if (e.key === ' ') {
        if (currentExamPhase === 'study') {
          e.preventDefault();
          toggleStudyTimerPause();
        }
        return;
      }

      // Numbers in Reveal Phase (1: Missed, 2: Partial, 3: Mastered)
      if (currentExamPhase === 'reveal') {
        if (e.key === '1') {
          e.preventDefault();
          recordScoreAndNext('missed');
        } else if (e.key === '2') {
          e.preventDefault();
          recordScoreAndNext('partial');
        } else if (e.key === '3') {
          e.preventDefault();
          recordScoreAndNext('mastered');
        }
      }
    });

    // INIT
    try {
      isAudioMuted = localStorage.getItem('audioMuted') === 'true';
    } catch (e) {}
    updateAudioIconUI();

    if (window.whenPacksReady) {
      window.whenPacksReady(function(packs) {
        initExamEngine();
      });
    } else {
      initExamEngine();
    }
  </script>
