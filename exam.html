<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#314fba">
  <title>EXAM MODE • GAMBLING WITH PRINCE NCIT</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23314fba'/%3E%3Cpath d='M32 12 C29 20 17 28 17 37 C17 43.5 22.5 47 28 45.8 C27 48.5 24.5 51 22 52 L42 52 C39.5 51 37 48.5 36 45.8 C41.5 47 47 43.5 47 37 C47 28 35 20 32 12 Z' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Special+Elite&display=swap" rel="stylesheet">
  <script src="packs/packs.js"></script>
  <style>
    /* =======================================================
       STRICT MONOCHROMATIC DESIGN SYSTEM:
       PRIMARY BLUE #314fba & WHITE #ffffff
       DEEP NAVY #172b7a
       FONTS: 'Special Elite' (Display) & 'Plus Jakarta Sans' (Body)
       SYMMETRICAL • TOUCH-FRIENDLY (MIN 48PX) • ZERO EMOJIS
       ======================================================= */

    :root {
      --primary: #314fba;
      --primary-dark: #223ca3;
      --primary-deep: #172b7a;
      --white: #ffffff;
      --white-90: rgba(255, 255, 255, 0.90);
      --white-75: rgba(255, 255, 255, 0.75);
      --white-50: rgba(255, 255, 255, 0.50);
      --white-25: rgba(255, 255, 255, 0.25);
      --white-15: rgba(255, 255, 255, 0.15);
      --surface-light: #f6f8fe;
      --surface-hover: #edf2fd;
      --border-light: #d8e2f8;
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Special Elite', cursive, monospace, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    body, button, input, textarea, select {
      font-family: var(--font-main);
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--primary);
      color: var(--white);
      user-select: none;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-left: max(14px, env(safe-area-inset-left));
      padding-right: max(14px, env(safe-area-inset-right));
      padding-bottom: max(32px, env(safe-area-inset-bottom));
      gap: clamp(14px, 2.2vh, 24px);
      box-sizing: border-box;
    }

    /* =======================================================
       SYMMETRICAL TOP BAR & APP HEADER
       ======================================================= */
    header.app-header {
      width: 100%;
      max-width: 980px;
      flex-shrink: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .top-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 820px;
    }

    .nav-btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--white-15);
      color: var(--white);
      border: 2px solid var(--white-25);
      padding: 0 18px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.16s ease;
      touch-action: manipulation;
    }
    .nav-btn:hover {
      background: var(--white);
      color: var(--primary-deep);
      border-color: var(--white);
      transform: translateY(-1px);
    }
    .nav-btn:active {
      transform: translateY(1px);
    }
    .nav-btn svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.5;
      flex-shrink: 0;
    }

    .title-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      margin-top: 2px;
    }

    h1.main-title,
    h1.main-title *,
    .title-tone-1,
    .title-tone-2 {
      font-family: 'Special Elite', cursive, monospace, sans-serif !important;
    }

    h1.main-title {
      font-size: clamp(1.4rem, 3.2vw, 2.5rem);
      font-weight: normal;
      letter-spacing: clamp(1.5px, 0.4vw, 3px);
      text-transform: uppercase;
      line-height: 1.15;
      margin: 0;
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 1.2vw, 12px);
      color: var(--primary-deep);
      text-align: center;
      user-select: none;
    }

    .title-tone-1,
    .title-tone-2 {
      color: var(--primary-deep);
      -webkit-text-fill-color: var(--primary-deep);
      -webkit-text-stroke: 4.5px #ffffff;
      paint-order: stroke fill;
      text-shadow:
        -3px -3px 0 #ffffff,
         3px -3px 0 #ffffff,
        -3px  3px 0 #ffffff,
         3px  3px 0 #ffffff,
        -4px  0   0 #ffffff,
         4px  0   0 #ffffff,
         0   -4px 0 #ffffff,
         0    4px 0 #ffffff,
         0px  5px 0 rgba(19, 34, 96, 0.7);
      display: inline-block;
      transition: transform 0.2s cubic-bezier(0.16, 1.2, 0.3, 1);
    }
    .title-tone-1:hover { transform: translateY(-2px) rotate(-1deg); }
    .title-tone-2:hover { transform: translateY(-2px) rotate(1deg); }

    .sub-meta {
      font-family: var(--font-main);
      font-size: clamp(0.72rem, 1.1vw, 0.82rem);
      font-weight: 700;
      color: var(--white-90);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(13, 26, 69, 0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 94vw;
      text-align: center;
    }

    @media (max-width: 600px) {
      h1.main-title {
        font-size: clamp(1.2rem, 5.2vw, 1.5rem);
        letter-spacing: 1.2px;
        gap: 5px;
      }
      .title-tone-1,
      .title-tone-2 {
        -webkit-text-stroke: 3.5px #ffffff;
      }
      .sub-meta {
        font-size: 0.68rem;
      }
      .nav-btn {
        padding: 0 14px;
        font-size: 12px;
      }
    }

    /* =======================================================
       EXAM MAIN WRAPPER
       ======================================================= */
    main.exam-main-wrap {
      width: 100%;
      max-width: 980px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-sizing: border-box;
      z-index: 5;
    }

    /* Common Card Styling */
    .exam-panel {
      width: 100%;
      background-color: var(--white);
      border: 3px solid var(--primary-deep);
      border-radius: 20px;
      box-shadow: 0 6px 0 var(--primary-deep);
      color: var(--primary-deep);
      box-sizing: border-box;
      animation: viewPop 0.2s ease-out;
    }
    @keyframes viewPop {
      0% { opacity: 0; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* =======================================================
       PHASE 1: EXAM SETUP CONFIGURATION CARD
       ======================================================= */
    .exam-config-card {
      max-width: 760px;
      padding: clamp(20px, 3vh, 32px);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .config-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border-light);
    }
    .config-badge {
      font-family: var(--font-display);
      font-size: 12px;
      letter-spacing: 1.5px;
      background-color: var(--primary-deep);
      color: var(--white);
      padding: 6px 16px;
      border-radius: 999px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .config-card-close {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 2px solid var(--primary-deep);
      background-color: var(--surface-light);
      color: var(--primary-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .config-card-close:hover {
      background-color: var(--primary-deep);
      color: var(--white);
    }
    .config-card-close svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.5;
    }

    .config-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .config-section-title {
      font-family: var(--font-display);
      font-size: 11.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--primary-deep);
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }
    .config-section-title svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.5;
    }

    /* Tabs & Search */
    .config-tabs-nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      width: 100%;
      padding-bottom: 2px;
    }
    .config-tabs-nav::-webkit-scrollbar { display: none; }
    .config-tab-btn {
      min-height: 44px;
      padding: 0 16px;
      border-radius: 10px;
      border: 2px solid var(--border-light);
      background-color: var(--surface-light);
      color: var(--primary-deep);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .config-tab-btn:hover {
      background-color: var(--surface-hover);
      border-color: var(--primary);
    }
    .config-tab-btn.active {
      background-color: var(--primary-deep);
      color: var(--white);
      border-color: var(--primary-deep);
    }

    .config-filter-search-box {
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
    }
    .config-search-icon {
      position: absolute;
      left: 14px;
      width: 16px;
      height: 16px;
      color: var(--primary-deep);
      pointer-events: none;
      opacity: 0.7;
    }
    .config-filter-search-input {
      width: 100%;
      min-height: 48px;
      box-sizing: border-box;
      padding: 0 14px 0 40px;
      border-radius: 12px;
      border: 2px solid var(--border-light);
      font-size: 14px;
      font-family: var(--font-main);
      color: var(--primary-deep);
      background-color: #fafcff;
      outline: none;
      transition: all 0.15s ease;
    }
    .config-filter-search-input:focus {
      border-color: var(--primary);
      background-color: var(--white);
      box-shadow: 0 0 0 3px rgba(49, 79, 186, 0.15);
    }

    .config-pills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 170px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .config-pill-btn {
      min-height: 48px;
      padding: 0 16px;
      border-radius: 999px;
      border: 2px solid var(--primary-deep);
      background-color: var(--surface-light);
      color: var(--primary-deep);
      font-family: var(--font-main);
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      user-select: none;
      touch-action: manipulation;
    }
    .config-pill-btn:hover {
      background-color: var(--surface-hover);
      transform: translateY(-1px);
    }
    .config-pill-btn.active {
      background-color: var(--primary-deep);
      color: var(--white);
      box-shadow: 0 3px 0 var(--primary);
    }

    .config-rules-box {
      background-color: var(--surface-light);
      border: 2px solid var(--primary-deep);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--primary-deep);
    }
    .rules-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .rules-bullet {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background-color: var(--primary);
      flex-shrink: 0;
    }

    .btn-start-exam {
      width: 100%;
      min-height: 52px;
      border-radius: 999px;
      background-color: var(--primary-deep);
      color: var(--white);
      border: 2px solid var(--primary-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--primary);
      transition: all 0.16s ease;
      touch-action: manipulation;
      margin-top: 4px;
    }
    .btn-start-exam:hover {
      background-color: var(--primary);
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--primary-deep);
    }
    .btn-start-exam:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 var(--primary-deep);
    }
    .btn-start-exam svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.8;
    }

    /* =======================================================
       PHASE 2: 5S PREPARATION COUNTDOWN
       ======================================================= */
    .exam-prep-card {
      max-width: 580px;
      padding: 44px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
    }
    .prep-countdown-circle {
      width: 96px;
      height: 96px;
      border-radius: 999px;
      background-color: var(--primary-deep);
      color: var(--white);
      border: 4px solid var(--white);
      box-shadow: 0 0 0 3px var(--primary-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 44px;
      font-weight: normal;
      animation: prepPulse 0.9s infinite alternate cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes prepPulse {
      0% { transform: scale(0.94); }
      100% { transform: scale(1.06); }
    }
    .prep-title {
      font-family: var(--font-display);
      font-size: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--primary-deep);
    }
    .prep-sub {
      font-size: 13.5px;
      line-height: 1.5;
      font-weight: 600;
      color: rgba(23, 43, 122, 0.8);
      max-width: 440px;
    }
    .btn-skip-prep {
      min-height: 48px;
      padding: 0 24px;
      border-radius: 999px;
      border: 2px solid var(--primary-deep);
      background-color: var(--surface-light);
      color: var(--primary-deep);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      transition: all 0.16s ease;
      touch-action: manipulation;
    }
    .btn-skip-prep:hover {
      background-color: var(--primary-deep);
      color: var(--white);
      transform: scale(1.03);
    }

    /* =======================================================
       PHASE 3: TIMED STUDY PHASE (SPLIT / STACKED LAYOUT)
       ======================================================= */
    .study-top-hud {
      width: 100%;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background-color: var(--white);
      border: 3px solid var(--primary-deep);
      border-radius: 999px;
      padding: 4px 14px;
      box-shadow: 0 4px 0 var(--primary-deep);
      color: var(--primary-deep);
      box-sizing: border-box;
    }
    .hud-specimen-pill {
      font-family: var(--font-display);
      font-size: 12.5px;
      letter-spacing: 1.5px;
      font-weight: 700;
      text-transform: uppercase;
      padding-left: 6px;
    }
    .hud-timer-wrap {
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: var(--surface-light);
      border: 2px solid var(--primary-deep);
      border-radius: 999px;
      padding: 0 14px 0 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .hud-timer-wrap:hover {
      background-color: var(--surface-hover);
      transform: scale(1.02);
    }
    .timer-svg-box {
      width: 24px;
      height: 24px;
      transform: rotate(-90deg);
    }
    .timer-circle-bg {
      fill: none;
      stroke: var(--border-light);
      stroke-width: 3;
    }
    .timer-circle-bar {
      fill: none;
      stroke: var(--primary-deep);
      stroke-width: 3;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.9s linear;
    }
    .hud-timer-text {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .hud-reveal-btn {
      min-height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      background-color: var(--primary-deep);
      color: var(--white);
      border: 2px solid var(--primary-deep);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.16s ease;
      touch-action: manipulation;
    }
    .hud-reveal-btn:hover {
      background-color: var(--primary);
      border-color: var(--primary);
      transform: scale(1.03);
    }
    .hud-reveal-btn svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.6;
    }

    /* Study Workspace Grid */
    .study-workspace-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 16px;
      align-items: stretch;
      box-sizing: border-box;
    }

    .study-visual-card {
      background-color: #081236;
      border: 3px solid var(--primary-deep);
      border-radius: 20px;
      box-shadow: 0 5px 0 var(--primary-deep);
      overflow-y: auto;
      overscroll-behavior: contain;
      min-height: 380px;
      max-height: calc(100vh - 170px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .study-visual-img {
      width: 100%;
      height: 100%;
      max-height: 460px;
      object-fit: contain;
      background-color: #060c22;
      display: block;
    }
    .study-vignette-box {
      padding: 24px;
      color: var(--white);
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
      width: 100%;
      box-sizing: border-box;
      align-self: flex-start;
    }
    .study-vignette-badge {
      font-family: var(--font-display);
      font-size: 10px;
      letter-spacing: 1.5px;
      background-color: var(--white);
      color: var(--primary-deep);
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 700;
      align-self: flex-start;
      text-transform: uppercase;
    }
    .study-vignette-text {
      font-size: 14px;
      line-height: 1.55;
      color: #eef3ff;
      font-weight: 600;
      white-space: pre-wrap;
    }

    .study-prompts-card {
      background-color: var(--white);
      border: 3px solid var(--primary-deep);
      border-radius: 20px;
      box-shadow: 0 5px 0 var(--primary-deep);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: var(--primary-deep);
      box-sizing: border-box;
      overflow-y: auto;
      overscroll-behavior: contain;
      max-height: calc(100vh - 170px);
    }
    .prompts-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border-light);
    }
    .prompts-card-title {
      font-family: var(--font-display);
      font-size: 14.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--primary-deep);
    }
    .prompt-box {
      background-color: var(--surface-light);
      border: 2px solid var(--primary-deep);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .prompt-box-badge {
      font-family: var(--font-display);
      font-size: 11.5px;
      letter-spacing: 1px;
      background-color: var(--primary-deep);
      color: var(--white);
      padding: 3.5px 10px;
      border-radius: 6px;
      font-weight: 800;
      align-self: flex-start;
      text-transform: uppercase;
    }
    .prompt-box-text {
      font-size: 16px;
      line-height: 1.55;
      font-weight: 600;
      color: var(--primary-deep);
      white-space: pre-wrap;
    }
    .exam-rx-block, .prompt-box-text pre, .study-vignette-box pre {
      background: #060e28;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #dce5ff;
      white-space: pre;
      overflow-x: auto;
      margin: 6px 0;
    }

    @media (max-width: 820px) {
      .study-workspace-grid {
        grid-template-columns: 1fr;
      }
      .study-visual-card {
        min-height: 240px;
        max-height: 340px;
      }
      .study-prompts-card {
        max-height: none;
      }
    }

    /* =======================================================
       PHASE 4: STRUCTURED REVEAL & SCORING PHASE
       ======================================================= */
    .reveal-workspace-card {
      padding: clamp(16px, 2.5vh, 26px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .reveal-header-bar {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border-light);
    }
    .reveal-title-badge {
      font-family: var(--font-display);
      font-size: 10.5px;
      letter-spacing: 1.5px;
      background-color: var(--primary-deep);
      color: var(--white);
      padding: 3px 12px;
      border-radius: 999px;
      font-weight: 700;
      align-self: flex-start;
      text-transform: uppercase;
    }
    .reveal-main-title {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 2.8vw, 2.1rem);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--primary-deep);
      line-height: 1.2;
    }
    .reveal-tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .reveal-tag {
      font-size: 12px;
      font-weight: 800;
      background-color: var(--surface-light);
      border: 1.5px solid var(--primary-deep);
      border-radius: 6px;
      padding: 3.5px 11px;
      color: var(--primary-deep);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .reveal-split-layout {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 16px;
      align-items: start;
    }
    .reveal-visual-card {
      background-color: #081236;
      border: 2px solid var(--primary-deep);
      border-radius: 16px;
      overflow-y: auto;
      overscroll-behavior: contain;
      min-height: 280px;
      max-height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .reveal-visual-img {
      width: 100%;
      height: 100%;
      max-height: 380px;
      object-fit: contain;
      background-color: #060c22;
      display: block;
    }
    .reveal-details-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .reveal-info-box {
      background-color: var(--surface-light);
      border: 2px solid var(--primary-deep);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .reveal-info-box.reveal-answer-a {
      background-color: #ffffff;
      border-left: 5px solid var(--primary);
    }
    .reveal-info-box.reveal-answer-b {
      background-color: #ffffff;
      border-left: 5px solid #2e7d32;
    }
    .reveal-info-box.reveal-answer-rx {
      background-color: #f7f9ff;
      border-left: 5px solid #172b7a;
    }
    .reveal-info-title {
      font-family: var(--font-display);
      font-size: 13.5px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--primary-deep);
      font-weight: 800;
    }
    .reveal-answer-a .reveal-info-title {
      color: var(--primary);
    }
    .reveal-answer-b .reveal-info-title {
      color: #1b5e20;
    }
    .reveal-info-content {
      font-size: 15.5px;
      line-height: 1.55;
      font-weight: 600;
      color: #172b7a;
    }
    .reveal-info-content strong {
      color: #0c1844;
      font-weight: 800;
    }
    .reveal-bullet-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .reveal-bullet-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .reveal-bullet-item .reveal-info-content {
      font-size: 15px;
      line-height: 1.5;
    }
    .reveal-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background-color: var(--primary-deep);
      margin-top: 7px;
      flex-shrink: 0;
    }

    @media (max-width: 820px) {
      .reveal-split-layout { grid-template-columns: 1fr; }
      .reveal-visual-card { min-height: 200px; }
    }

    /* Scoring Choice Section */
    .reveal-scoring-box {
      background-color: var(--primary-deep);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--white);
    }
    .scoring-label-text {
      font-family: var(--font-display);
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .scoring-btn-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-score-pick {
      min-height: 48px;
      padding: 0 20px;
      border-radius: 999px;
      border: 2px solid var(--white);
      background-color: var(--white);
      color: var(--primary-deep);
      font-family: var(--font-main);
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.16s ease;
      user-select: none;
      touch-action: manipulation;
    }
    .btn-score-pick:hover {
      background-color: var(--primary);
      color: var(--white);
      border-color: var(--white);
      transform: translateY(-2px);
    }
    .btn-score-pick:active {
      transform: translateY(1px);
    }
    .btn-score-pick.mastered-btn {
      background-color: var(--white);
      color: var(--primary-deep);
    }
    .btn-score-pick.mastered-btn:hover {
      background-color: #25a244;
      border-color: #25a244;
      color: #fff;
    }

    /* =======================================================
       PHASE 5: RESULTS & SCORECARD
       ======================================================= */
    .exam-summary-card {
      max-width: 620px;
      padding: 36px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
    }
    .summary-grade-badge {
      font-family: var(--font-display);
      font-size: 12px;
      letter-spacing: 2px;
      padding: 4px 16px;
      border-radius: 999px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .summary-grade-badge.pass {
      background-color: #25a244;
      color: #ffffff;
      border: 2px solid var(--primary-deep);
    }
    .summary-grade-badge.review {
      background-color: var(--primary);
      color: #ffffff;
      border: 2px solid var(--primary-deep);
    }
    .summary-score-badge {
      width: 110px;
      height: 110px;
      border-radius: 999px;
      background-color: var(--primary-deep);
      color: var(--white);
      border: 4px solid var(--white);
      box-shadow: 0 0 0 3px var(--primary-deep);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 34px;
      line-height: 1;
    }
    .summary-score-sub {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .summary-title {
      font-family: var(--font-display);
      font-size: 22px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--primary-deep);
    }
    .summary-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 480px;
    }
    .summary-stat-item {
      background-color: var(--surface-light);
      border: 2px solid var(--primary-deep);
      border-radius: 12px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .summary-stat-val {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--primary-deep);
    }
    .summary-stat-lbl {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: rgba(23, 43, 122, 0.75);
      text-transform: uppercase;
    }
    .summary-actions-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 6px;
      width: 100%;
    }
    .btn-summary-action {
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      border: 2px solid var(--primary-deep);
      background-color: var(--primary-deep);
      color: var(--white);
      font-family: var(--font-display);
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.16s ease;
      touch-action: manipulation;
    }
    .btn-summary-action:hover {
      background-color: var(--primary);
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .btn-summary-action.alt {
      background-color: var(--surface-light);
      color: var(--primary-deep);
    }
    .btn-summary-action.alt:hover {
      background-color: var(--primary-deep);
      color: var(--white);
    }

    /* =======================================================
       REVIEW MODAL
       ======================================================= */
    .review-modal-scrim {
      position: fixed;
      inset: 0;
      background: rgba(13, 27, 77, 0.75);
      z-index: 4000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: clamp(14px, 3vw, 24px);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      animation: fadeIn 0.18s ease-out;
    }
    .review-modal-scrim.active {
      display: flex;
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    .review-modal-card {
      width: 100%;
      max-width: 820px;
      max-height: 88vh;
      background-color: var(--white);
      border: 3px solid var(--primary-deep);
      border-radius: 20px;
      box-shadow: 0 8px 0 var(--primary-deep);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: viewPop 0.2s ease-out;
    }
    .review-modal-header {
      padding: 16px 20px;
      border-bottom: 2px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background-color: #fafcff;
      flex-shrink: 0;
    }
    .review-modal-title {
      font-family: var(--font-display);
      font-size: 16px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--primary-deep);
    }
    .review-modal-sub {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
    }
    .review-modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
    }
    .review-filter-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
      flex-shrink: 0;
    }
    .review-filter-tabs::-webkit-scrollbar { display: none; }
    .review-filter-btn {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1.5px solid var(--border-light);
      background-color: var(--surface-light);
      color: var(--primary-deep);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .review-filter-btn.active {
      background-color: var(--primary-deep);
      color: var(--white);
      border-color: var(--primary-deep);
    }
    .review-station-item {
      background-color: var(--surface-light);
      border: 2px solid var(--primary-deep);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.15s ease;
    }
    .review-station-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      min-height: 52px;
      box-sizing: border-box;
      touch-action: manipulation;
    }
    .review-station-header:hover {
      background-color: var(--surface-hover);
    }
    .review-station-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-grow: 1;
      overflow: hidden;
    }
    .review-station-num {
      font-family: var(--font-display);
      font-size: 12px;
      letter-spacing: 1px;
      background-color: var(--primary-deep);
      color: var(--white);
      padding: 4px 8px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .review-station-name {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--primary-deep);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .review-score-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .review-score-tag.mastered {
      background-color: #25a244;
      color: #ffffff;
    }
    .review-score-tag.partial {
      background-color: #e0b000;
      color: #172b7a;
    }
    .review-score-tag.missed {
      background-color: #d13434;
      color: #ffffff;
    }
    .review-station-detail {
      display: none;
      padding: 14px 16px;
      border-top: 1.5px solid var(--border-light);
      background-color: #ffffff;
      flex-direction: column;
      gap: 10px;
      font-size: 12.5px;
      line-height: 1.45;
    }
    .review-station-detail.open {
      display: flex;
    }
    .review-modal-footer {
      padding: 12px 20px;
      border-top: 2px solid var(--border-light);
      display: flex;
      justify-content: flex-end;
      background-color: #fafcff;
      flex-shrink: 0;
    }

    /* =======================================================
       FULL-SCREEN TOAST NOTICE & SCRIM
       ======================================================= */
    .screen-scrim {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(13, 27, 77, 0.72) 0%, rgba(6, 12, 38, 0.92) 100%);
      z-index: 3400;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body.toast-active .screen-scrim,
    .screen-scrim.active {
      opacity: 1;
      pointer-events: auto;
    }
    .toast-notice {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.65);
      opacity: 0;
      pointer-events: none;
      z-index: 3600;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toast-notice.show {
      animation: gameToastSplash 1.4s cubic-bezier(0.16, 1.25, 0.3, 1) forwards;
    }
    @keyframes gameToastSplash {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.65); }
      18% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
      30% { transform: translate(-50%, -50%) scale(1); }
      80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1) translateY(-10px); }
    }
    .toast-card-badge {
      background-color: var(--white);
      border: 3.5px solid var(--primary-deep);
      border-radius: 24px;
      padding: clamp(14px, 2.5vh, 20px) clamp(22px, 3.5vw, 36px);
      box-shadow: 0 8px 0 var(--primary-deep), 0 0 0 6px var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: clamp(260px, 36vw, 360px);
      max-width: 90vw;
      text-align: center;
      user-select: none;
    }
    .toast-emblem-wrap {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      background-color: var(--primary);
      border: 2.5px solid var(--primary-deep);
      box-shadow: 0 0 0 2px var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      flex-shrink: 0;
    }
    .toast-emblem-icon {
      width: 24px;
      height: 24px;
    }
    .toast-title {
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 2.4vw, 1.6rem);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--primary-deep);
      line-height: 1.1;
    }
    .toast-subtext {
      font-family: var(--font-main);
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      background-color: var(--surface-light);
      border: 1.5px solid var(--primary-deep);
      border-radius: 999px;
      padding: 3px 12px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- FULL-SCREEN BACKDROP SCRIM -->
  <div class="screen-scrim" id="screenScrim" aria-hidden="true"></div>

  <!-- TOAST NOTICE -->
  <div class="toast-notice" id="toastNotice" aria-live="polite">
    <div class="toast-card-badge">
      <div class="toast-emblem-wrap">
        <svg class="toast-emblem-icon" viewBox="0 0 64 64" fill="currentColor">
          <path d="M32 12 C29 20 17 28 17 37 C17 43.5 22.5 47 28 45.8 C27 48.5 24.5 51 22 52 L42 52 C39.5 51 37 48.5 36 45.8 C41.5 47 47 43.5 47 37 C47 28 35 20 32 12 Z"/>
        </svg>
      </div>
      <div class="toast-title" id="toastTitle">EXAM MODE</div>
      <div class="toast-subtext" id="toastSub">Ready</div>
    </div>
  </div>

  <!-- SYMMETRICAL APP HEADER -->
  <header class="app-header">
    <nav class="top-nav-bar" aria-label="Exam Navigation">
      <a href="index.html" class="nav-btn" title="Return to Lobby [Esc]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <span>Lobby</span>
      </a>

      <button type="button" class="nav-btn" onclick="toggleAudioMute()" title="Toggle Sound [M]" id="btnAudioToggle">
        <span id="audioIconSlot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        </span>
        <span id="audioLabelSlot">Sound [M]</span>
      </button>
    </nav>

    <div class="title-row">
      <h1 class="main-title">
        <span class="title-tone-1">EXAM MODE</span>
        <span class="title-tone-2">PRINCE NCIT</span>
      </h1>
    </div>

    <div class="sub-meta" id="examSubMeta">Practical Exam Simulation // 60s per Station</div>
  </header>

  <!-- MAIN EXAM WORKSPACE -->
  <main class="exam-main-wrap" id="examMainWrap" role="main">
    <!-- Dynamically rendered via renderCurrentPhase() -->
  </main>

  <!-- REVIEW MODAL OVERLAY -->
  <div class="review-modal-scrim" id="reviewModalScrim" role="dialog" aria-modal="true" aria-labelledby="reviewModalTitle">
    <div class="review-modal-card">
      <div class="review-modal-header">
        <div>
          <div class="review-modal-title" id="reviewModalTitle">Station Review</div>
          <div class="review-modal-sub" id="reviewModalSub">Evaluation Summary</div>
        </div>
        <button type="button" class="config-card-close" onclick="closeReviewModal()" title="Close Review [Esc]">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="review-modal-body" id="reviewModalBody">
        <!-- Rendered by renderReviewList() -->
      </div>

      <div class="review-modal-footer">
        <button type="button" class="btn-summary-action alt" onclick="closeReviewModal()">
          <span>Back to Results</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // =======================================================
    // STATE & ENGINE VARIABLES
    // =======================================================
    let selectedPackIds = [];
    let ALL_EXAM_CARDS = [];
    let examActiveFilter = 'all';
    let examTargetCount = 20;
    let examRevealTiming = 'per-card'; // 'per-card' (Instant) or 'batch-end' (Batch)
    try {
      const storedTiming = localStorage.getItem('examRevealTiming');
      if (storedTiming === 'per-card' || storedTiming === 'batch-end') {
        examRevealTiming = storedTiming;
      }
    } catch (e) {}

    // Phases: 'setup', 'prep', 'study', 'reveal', 'summary'
    let currentExamPhase = 'setup';
    let examSessionCards = [];
    let currentCardIndex = 0;
    let prepTimer = null;
    let prepRemaining = 5;
    let studyTimer = null;
    let studyRemaining = 60;
    let isTimerPaused = false;

    // Answer tracking & scoring history
    let examScores = {
      mastered: 0,
      partial: 0,
      missed: 0,
      totalPoints: 0
    };
    let examSessionHistory = []; // { card, score: 'mastered'|'partial'|'missed', points }

    // Audio & Toast
    let isAudioMuted = false;
    let audioCtx = null;
    let toastTimer = null;

    // Filter controls
    let examFilterTab = 'popular';
    let examFilterQuery = '';
    let reviewActiveFilter = 'all';

    // =======================================================
    // INITIALIZATION & PACK LOADING
    // =======================================================
    function initExamEngine() {
      const packs = window.CARD_PACKS || {};
      const allPackKeys = Object.keys(packs);

      try {
        const stored = localStorage.getItem('selectedCardPacks');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) {
            selectedPackIds = parsed.filter(id => packs[id]);
          }
        }
      } catch (e) {}

      if (!selectedPackIds || selectedPackIds.length === 0) {
        selectedPackIds = allPackKeys.length > 0 ? [...allPackKeys] : [];
      }

      // Combine cards
      let combined = [];
      selectedPackIds.forEach(pId => {
        const p = packs[pId];
        if (p && p.cards) {
          p.cards.forEach(c => {
            combined.push({
              ...c,
              _packId: pId,
              _packName: p.packName || pId,
              _packBadge: p.badge || 'PACK'
            });
          });
        }
      });

      ALL_EXAM_CARDS = combined;

      // Update Sub-Meta
      const subMeta = document.getElementById('examSubMeta');
      if (subMeta) {
        const packNames = selectedPackIds.map(id => packs[id]?.badge || packs[id]?.packName || id).join(' + ');
        subMeta.textContent = `${packNames || 'EXAM SIMULATION'} // ${ALL_EXAM_CARDS.length} STATIONS`;
      }

      renderCurrentPhase();
    }

    // =======================================================
    // FILTER LOGIC
    // =======================================================
    function isCardMatchingFilter(card, filterId) {
      if (!filterId || filterId === 'all') return true;
      if (filterId === 'preparat') return card.type === 'preparat';
      if (filterId === 'teori') return card.type === 'teori' || card.type === 'theory';
      if (filterId === 'prioritas') return !!card.is_priority || !!card.prioritas_tinggi;
      if (filterId === 'resep') return !!card.has_resep || !!card.resep_teks;
      if (filterId === 'kardio') return card.section === 'Kardiovaskular & Ginjal' || (card.tags && card.tags.includes('kardio'));
      if (filterId === 'respirasi') return card.section === 'Respirasi & Infeksi Terkait' || card.section === 'Respirasi & Infeksi' || (card.tags && card.tags.includes('respirasi'));
      if (filterId === 'ccb') return (card.sub_class && card.sub_class.startsWith('ccb')) || (card.tags && card.tags.includes('ccb'));
      if (filterId === 'diuretik') return card.sub_category === 'diuretik' || (card.tags && card.tags.includes('diuretik'));
      if (filterId.startsWith('th-')) {
        const yr = filterId.replace('th-', '');
        return (card.years && card.years.includes(yr)) || (card.tags && card.tags.includes(yr)) || (card.tags && card.tags.includes(filterId));
      }
      if (card.sub_category === filterId) return true;
      if (card.sub_class === filterId) return true;
      if (card.clinical_role === filterId) return true;
      if (card.question_types && card.question_types.includes(filterId)) return true;
      if (card.tags && card.tags.includes(filterId)) return true;
      if (card.type === filterId) return true;
      if (card._packId === filterId) return true;
      return false;
    }

    function sanitizeFilterLabel(rawLabel, count) {
      if (!rawLabel) return 'All';
      // Strip emojis
      let clean = rawLabel.replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{27BF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}]/gu, '').trim();

      // Simple English translations
      const map = {
        'Semua Stasi': 'All Stations',
        'Semua Soal': 'All Stations',
        'Semua': 'All Stations',
        'Prioritas Tinggi': 'High Priority',
        'Kardiovaskular & Ginjal': 'Cardio & Renal',
        'Kardio & Ginjal': 'Cardio & Renal',
        'Respirasi & Infeksi': 'Respiratory',
        'Respirasi & Infeksi Terkait': 'Respiratory',
        'Diuretik': 'Diuretics',
        'Simpatolitik & CCB': 'CCB & Sympatholytics',
        'RAAS & Vasodilator': 'RAAS & Vasodilators',
        'Inotropik & Antiangina': 'Inotropics & Antiangina',
        'Antiaritmia': 'Antiarrhythmics',
        'Antihipertensi Khusus': 'Antihypertensives',
        'Asma & PPOK': 'Asthma & COPD',
        'OAT & Tuberkulosis': 'Tuberculosis (OAT)',
        'Pneumonia & Antibiotik': 'Pneumonia & Antibiotics',
        'Preparat': 'Histopathology',
        'Teori': 'Theory & Cases'
      };

      for (const [idTerm, enTerm] of Object.entries(map)) {
        if (clean.toLowerCase().includes(idTerm.toLowerCase())) {
          clean = clean.replace(new RegExp(idTerm, 'i'), enTerm);
        }
      }

      if (count !== undefined && !clean.includes('(')) {
        clean = `${clean} (${count})`;
      }
      return clean.trim();
    }

    function getActiveExamFilters() {
      const packs = window.CARD_PACKS || {};
      let singlePack = selectedPackIds.length === 1 ? packs[selectedPackIds[0]] : null;
      if (singlePack && Array.isArray(singlePack.filters) && singlePack.filters.length > 0) {
        return singlePack.filters.map(f => {
          const count = ALL_EXAM_CARDS.filter(c => isCardMatchingFilter(c, f.id)).length;
          return {
            ...f,
            label: sanitizeFilterLabel(f.label, count),
            count
          };
        }).filter(f => f.id === 'all' || f.count > 0);
      }

      const list = [
        { id: 'all', label: `All Stations (${ALL_EXAM_CARDS.length})`, count: ALL_EXAM_CARDS.length, group: 'sistem' }
      ];
      const pCount = ALL_EXAM_CARDS.filter(c => c.is_priority || c.prioritas_tinggi).length;
      if (pCount > 0) list.push({ id: 'prioritas', label: `High Priority (${pCount})`, count: pCount, group: 'arsip' });

      const kCount = ALL_EXAM_CARDS.filter(c => isCardMatchingFilter(c, 'kardio')).length;
      if (kCount > 0) list.push({ id: 'kardio', label: `Cardio & Renal (${kCount})`, count: kCount, group: 'sistem' });

      const rCount = ALL_EXAM_CARDS.filter(c => isCardMatchingFilter(c, 'respirasi')).length;
      if (rCount > 0) list.push({ id: 'respirasi', label: `Respiratory (${rCount})`, count: rCount, group: 'sistem' });

      const prepCount = ALL_EXAM_CARDS.filter(c => c.type === 'preparat').length;
      if (prepCount > 0 && prepCount !== ALL_EXAM_CARDS.length) list.push({ id: 'preparat', label: `Histopathology (${prepCount})`, count: prepCount, group: 'sistem' });

      const teoriCount = ALL_EXAM_CARDS.filter(c => c.type === 'teori').length;
      if (teoriCount > 0 && teoriCount !== ALL_EXAM_CARDS.length) list.push({ id: 'teori', label: `Theory & Cases (${teoriCount})`, count: teoriCount, group: 'tipe' });

      return list;
    }

    // PHASE ROUTER
    // =======================================================
    function renderCurrentPhase() {
      const wrap = document.getElementById('examMainWrap');
      if (!wrap) return;

      if (currentExamPhase === 'setup') {
        renderSetupPhase(wrap);
      } else if (currentExamPhase === 'prep') {
        renderPrepPhase(wrap);
      } else if (currentExamPhase === 'study') {
        renderStudyPhase(wrap);
      } else if (currentExamPhase === 'reveal') {
        renderRevealPhase(wrap);
      } else if (currentExamPhase === 'summary') {
        renderSummaryPhase(wrap);
      }
    }

      examFilterTab = tab;
      updateFilterPillsContainer();

      examFilterQuery = (query || '').trim().toLowerCase();

    function updateFilterPillsContainer() {
      const container = document.getElementById('filterPillsRow');
      if (!container) {
        renderCurrentPhase();
        return;
      }
      const filters = getActiveExamFilters();
      const visibleFilters = getFilteredFilterList(filters);

      container.innerHTML = visibleFilters.map(f => `
        <button type="button" class="config-pill-btn ${examActiveFilter === f.id ? 'active' : ''}" onclick="setExamFilter('${f.id}')" title="${f.label}">
          <span>${f.label}</span>
        </button>
      `).join('') || '<div style="font-size:12.5px;color:rgba(23,43,122,0.65);padding:10px 4px;">No matching topics found</div>';

      // Update active tabs state
      const tabs = document.querySelectorAll('.config-tab-btn');
      tabs.forEach(t => {
        if (t.dataset.tab === examFilterTab) t.classList.add('active');
        else t.classList.remove('active');
      });

    function getFilteredFilterList(filters) {
      const popularIds = ['all', 'preparat', 'teori', 'prioritas', 'resep', 'th-2024', 'kardio', 'respirasi', 'diuretik', 'asma-ppok', 'oat', 'pneumonia', 'loop', 'beta-blocker', 'ccb', 'acei'];

      let visible = filters;
      if (examFilterQuery) {
        visible = filters.filter(f =>
          f.label.toLowerCase().includes(examFilterQuery) ||
          f.id.toLowerCase().includes(examFilterQuery)
        );
      } else if (examFilterTab === 'popular') {
        visible = filters.filter(f => popularIds.includes(f.id));
      } else if (examFilterTab !== 'all') {
        visible = filters.filter(f => f.group === examFilterTab || f.id === 'all');
      }

      if (!visible.some(f => f.id === examActiveFilter)) {
        const activeF = filters.find(f => f.id === examActiveFilter);
        if (activeF) visible.unshift(activeF);
      }
      return visible;
    }

    // =======================================================
    // TEXT SANITIZER & FORMATTER
    // =======================================================
    function sanitizeLatexAndCode(text) {
      if (!text) return '';
      return String(text)
        .replace(/\\rightarrow/g, '→')
        .replace(/\\leftarrow/g, '←')
        .replace(/\\leftrightarrow/g, '↔')
        .replace(/\\beta_?([0-9]+)?/g, (m, d) => 'β' + (d ? (d === '1' ? '₁' : d === '2' ? '₂' : d === '3' ? '₃' : d) : ''))
        .replace(/\\alpha_?([0-9]+)?/g, (m, d) => 'α' + (d ? (d === '1' ? '₁' : d === '2' ? '₂' : d === '3' ? '₃' : d) : ''))
        .replace(/\\text\{([^{}]+)\}/g, '$1')
        .replace(/\{,\}/g, ',')
        .replace(/\$([^\$]+)\$/g, '$1')
        .replace(/\$/g, '');
    }

    function formatExamPromptText(text) {
      if (!text) return '';
      let clean = sanitizeLatexAndCode(text);
      let html = String(clean)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      html = html.replace(/```(?:text)?\s*([\s\S]*?)```/g, (m, code) => {
        return `<pre class="exam-rx-block"><code>${code.trim()}</code></pre>`;
      });
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      return html;
    }

    // =======================================================
    // PHASE 5: SUMMARY & RESULTS
    // =======================================================

      const maxPoints = totalCards * 2;

      const isPass = pct >= 70;

      container.innerHTML = `
        <div class="exam-panel exam-summary-card">
          <div class="summary-grade-badge ${isPass ? 'pass' : 'review'}">

            <span>${pct}%</span>

              <span class="summary-stat-val">${examScores.partial}</span>

    // =======================================================
    // REVIEW MODAL LOGIC
    // =======================================================
    function openReviewModal() {
      const scrim = document.getElementById('reviewModalScrim');
      const sub = document.getElementById('reviewModalSub');
      if (sub) {
        const total = examSessionHistory.length;
        const maxPoints = total * 2;
        const pct = maxPoints > 0 ? Math.round((examScores.totalPoints / maxPoints) * 100) : 0;
        sub.textContent = `${total} Stations • ${examScores.totalPoints}/${maxPoints} PTS (${pct}%)`;
      }
      reviewActiveFilter = 'all';
      renderReviewList();
      if (scrim) scrim.classList.add('active');
    }

    function closeReviewModal() {
      const scrim = document.getElementById('reviewModalScrim');
      if (scrim) scrim.classList.remove('active');
    }

    function setReviewFilter(filterType) {
      reviewActiveFilter = filterType;
      renderReviewList();
    }

    function toggleReviewDetail(idx) {
      const detail = document.getElementById(`reviewDetail_${idx}`);
      if (detail) {
        detail.classList.toggle('open');
      }
    }

    function renderReviewList() {
      const body = document.getElementById('reviewModalBody');
      if (!body) return;

      let filtered = examSessionHistory;
      if (reviewActiveFilter !== 'all') {
        filtered = examSessionHistory.filter(h => h.score === reviewActiveFilter);
      }

      body.innerHTML = `
        <div class="review-filter-tabs">
          <button type="button" class="review-filter-btn ${reviewActiveFilter === 'all' ? 'active' : ''}" onclick="setReviewFilter('all')">All (${examSessionHistory.length})</button>
          <button type="button" class="review-filter-btn ${reviewActiveFilter === 'mastered' ? 'active' : ''}" onclick="setReviewFilter('mastered')">Mastered (${examScores.mastered})</button>
          <button type="button" class="review-filter-btn ${reviewActiveFilter === 'partial' ? 'active' : ''}" onclick="setReviewFilter('partial')">Partial (${examScores.partial})</button>
          <button type="button" class="review-filter-btn ${reviewActiveFilter === 'missed' ? 'active' : ''}" onclick="setReviewFilter('missed')">Missed (${examScores.missed})</button>
        </div>

        <div style="display:flex; flex-direction:column; gap:8px; margin-top:4px;">

                      <div style="font-size:13.5px; font-weight:600; color:#172b7a;">${card.jawaban_a || card.jawaban_ringkas || card.mekanisme || etiologiText}</div>
                    </div>
                    ${card.soal_b || card.jawaban_b ? `
                      <div style="background:#ffffff; border:1.5px solid #d0dcf5; border-left:4px solid #2e7d32; border-radius:8px; padding:10px 12px; margin-top:6px;">
                        <div style="font-size:11px; font-weight:800; color:#1b5e20; margin-bottom:2px;">[B] Class & Prescription</div>

                        </ul>

    // =======================================================
    // INTERACTIONS & ENGINE ROUTINES
    // =======================================================
    function setExamFilter(filterType) {
      playClickSound();
      examActiveFilter = filterType;
      renderCurrentPhase();
    }

    function setExamCount(countVal) {
      playClickSound();
      examTargetCount = countVal;
      renderCurrentPhase();
    }

    function setExamRevealTiming(timing) {
      playClickSound();
      examRevealTiming = timing;
      try {
        localStorage.setItem('examRevealTiming', timing);
      } catch (e) {}
      renderCurrentPhase();
    }

    function startExamSession() {
      playLaunchSound();
      let pool = [];
      if (examActiveFilter === 'all') {
        pool = [...ALL_EXAM_CARDS];
      } else {
        pool = ALL_EXAM_CARDS.filter(c => isCardMatchingFilter(c, examActiveFilter));
      }

      if (pool.length === 0) {
        showToast('Notice', 'No stations found for this filter');
        playErrorSound();
        return;
      }

      pool = shuffleArray(pool);

      if (examTargetCount !== 'all' && typeof examTargetCount === 'number') {
        examSessionCards = pool.slice(0, examTargetCount);
      } else {
        examSessionCards = pool;
      }

      currentCardIndex = 0;
      examScores = { mastered: 0, partial: 0, missed: 0, totalPoints: 0 };
      examSessionHistory = [];

      showToast('Exam Started', `${examSessionCards.length} stations queued`);
      startPrepCountdown();
    }

    function startPrepCountdown() {
      currentExamPhase = 'prep';
      prepRemaining = 5;
      renderCurrentPhase();
      playTickSound();

      if (prepTimer) clearInterval(prepTimer);
      prepTimer = setInterval(() => {
        prepRemaining--;
        if (prepRemaining > 0) {
          playTickSound();
          const el = document.getElementById('prepCounterEl');
          if (el) el.textContent = prepRemaining;
        } else {
          clearInterval(prepTimer);
          prepTimer = null;
          startStudyCountdown();
        }
      }, 1000);
    }

    function skipPrepToStudy() {
      if (prepTimer) clearInterval(prepTimer);
      prepTimer = null;
      startStudyCountdown();
    }

    function startStudyCountdown() {
      currentExamPhase = 'study';
      studyRemaining = 60;
      isTimerPaused = false;
      renderCurrentPhase();
      playTone(520, 'sine', 0.12);

      if (studyTimer) clearInterval(studyTimer);
      studyTimer = setInterval(() => {
        if (isTimerPaused) return;

        studyRemaining--;
        const secEl = document.getElementById('studySecondsEl');
        const progressEl = document.getElementById('timerCircleBar');
        if (secEl) secEl.textContent = `${studyRemaining}s`;
        if (progressEl) {
          const offset = ((60 - studyRemaining) / 60) * 56.5;
          progressEl.setAttribute('stroke-dashoffset', offset);
        }

        if (studyRemaining <= 5 && studyRemaining > 0) {
          playWarningTick();
        }

        if (studyRemaining <= 0) {
          clearInterval(studyTimer);
          studyTimer = null;
          if (examRevealTiming === 'per-card') {
            revealCurrentAnswer();
          } else {
            advanceStudySpecimen();
          }
        }
      }, 1000);
    }

    function toggleStudyTimerPause() {
      isTimerPaused = !isTimerPaused;
      showToast('Timer', isTimerPaused ? 'Paused' : 'Resumed');
      const box = document.getElementById('studyTimerWrap');
      if (box) {
        box.style.opacity = isTimerPaused ? '0.6' : '1';
      }
    }

    function revealCurrentAnswer() {
      if (studyTimer) clearInterval(studyTimer);
      studyTimer = null;
      playRevealSound();
      currentExamPhase = 'reveal';
      renderCurrentPhase();
    }

    function advanceStudySpecimen() {
      if (studyTimer) clearInterval(studyTimer);
      studyTimer = null;
      playTone(660, 'triangle', 0.12);

      currentCardIndex++;
      if (currentCardIndex < examSessionCards.length) {
        startStudyCountdown();
      } else {
        startBatchReveal();
      }
    }

    function startBatchReveal() {
      currentCardIndex = 0;
      currentExamPhase = 'reveal';
      playRevealSound();
      showToast('Stations Complete', 'Reviewing Answers');
      renderCurrentPhase();
    }

    function recordScoreAndNext(choice) {
      playSelectSound();
      const currentCard = examSessionCards[currentCardIndex];
      let pts = 0;

      if (choice === 'mastered') {
        examScores.mastered++;
        examScores.totalPoints += 2;
        pts = 2;
      } else if (choice === 'partial') {
        examScores.partial++;
        examScores.totalPoints += 1;
        pts = 1;
      } else {
        examScores.missed++;
      }

      examSessionHistory.push({
        card: currentCard,
        score: choice,
        points: pts
      });

      currentCardIndex++;
      if (currentCardIndex < examSessionCards.length) {
        if (examRevealTiming === 'per-card') {
          startStudyCountdown();
        } else {
          renderCurrentPhase();
        }
      } else {
        finishExamSession();
      }
    }

    function finishExamSession() {
      currentExamPhase = 'summary';
      playChimeSound();
      renderCurrentPhase();
    }

    function restartExamSimulation() {
      currentExamPhase = 'setup';
      renderCurrentPhase();
    }

    function shuffleArray(arr) {
      const clone = [...arr];
      for (let i = clone.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [clone[i], clone[j]] = [clone[j], clone[i]];
      }
      return clone;
    }

    // =======================================================
    // AUDIO SYNTHESIZER
    // =======================================================
    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleAudioMute() {
      isAudioMuted = !isAudioMuted;
      try {
        localStorage.setItem('audioMuted', isAudioMuted ? 'true' : 'false');
      } catch (e) {}
      updateAudioIconUI();
      if (!isAudioMuted) {
        initAudioContext();
        playSelectSound();
        showToast('Sound', 'Audio Enabled');
      } else {
        showToast('Sound', 'Audio Muted');
      }
    }

    function updateAudioIconUI() {
      const iconSlot = document.getElementById('audioIconSlot');
      const labelSlot = document.getElementById('audioLabelSlot');
      if (iconSlot) {
        iconSlot.innerHTML = isAudioMuted ? `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
        ` : `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        `;
      }
      if (labelSlot) {
        labelSlot.textContent = isAudioMuted ? 'Muted [M]' : 'Sound [M]';
      }
    }

    function playTone(freq, type, duration) {
      if (isAudioMuted) return;
      initAudioContext();
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playClickSound() { playTone(620, 'triangle', 0.05); }
    function playSelectSound() { playTone(880, 'sine', 0.08); }
    function playLaunchSound() { playTone(720, 'triangle', 0.16); }
    function playTickSound() { playTone(440, 'triangle', 0.04); }
    function playWarningTick() { playTone(330, 'sawtooth', 0.07); }
    function playRevealSound() { playTone(660, 'sine', 0.14); }
    function playChimeSound() {
      playTone(659, 'sine', 0.10);
      setTimeout(() => playTone(987, 'sine', 0.16), 80);
    }
    function playErrorSound() { playTone(160, 'sawtooth', 0.14); }

    // =======================================================
    // GAME-STYLE TOAST NOTICE
    // =======================================================
    function showToast(title, sub = '') {
      const toastNotice = document.getElementById('toastNotice');
      const screenScrim = document.getElementById('screenScrim');
      if (!toastNotice) return;

      const toastTitleEl = document.getElementById('toastTitle');
      const toastSubEl = document.getElementById('toastSub');

      if (toastTitleEl) toastTitleEl.textContent = title;
      if (toastSubEl) {
        if (sub) {
          toastSubEl.textContent = sub;
          toastSubEl.style.display = 'inline-block';
        } else {
          toastSubEl.style.display = 'none';
        }
      }

      document.body.classList.add('toast-active');
      if (screenScrim) screenScrim.classList.add('active');

      toastNotice.classList.remove('show');
      void toastNotice.offsetWidth;
      toastNotice.classList.add('show');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastNotice.classList.remove('show');
        if (screenScrim) screenScrim.classList.remove('active');
        document.body.classList.remove('toast-active');
      }, 1400);
    }

    // =======================================================
    // KEYBOARD SHORTCUTS
    // =======================================================
    window.addEventListener('keydown', (e) => {
      // Esc: Close Review Modal if open, otherwise Return to Lobby
      if (e.key === 'Escape') {
        e.preventDefault();
        const reviewScrim = document.getElementById('reviewModalScrim');
        if (reviewScrim && reviewScrim.classList.contains('active')) {
          closeReviewModal();
          return;
        }
        window.location.href = 'index.html';
        return;
      }

      // M: Audio Mute
      if (e.key === 'm' || e.key === 'M') {
        const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
        if (activeTag !== 'input' && activeTag !== 'textarea') {
          e.preventDefault();
          toggleAudioMute();
          return;
        }
      }

      // Enter
      if (e.key === 'Enter') {
        const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
        if (activeTag === 'input') return; // let search input handle enter naturally

        e.preventDefault();
        if (currentExamPhase === 'setup') startExamSession();
        else if (currentExamPhase === 'prep') skipPrepToStudy();
        else if (currentExamPhase === 'study') {
          if (examRevealTiming === 'per-card') revealCurrentAnswer();
          else advanceStudySpecimen();
        }
        else if (currentExamPhase === 'reveal') recordScoreAndNext('mastered');
        else if (currentExamPhase === 'summary') restartExamSimulation();
        return;
      }

      // Space: Pause/Resume Study Timer
      if (e.key === ' ') {
        const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
        if (activeTag !== 'input' && currentExamPhase === 'study') {
          e.preventDefault();
          toggleStudyTimerPause();
        }
        return;
      }

      // Numbers in Reveal Phase (1: Missed, 2: Partial, 3: Mastered)
      if (currentExamPhase === 'reveal') {
        if (e.key === '1') {
          e.preventDefault();
          recordScoreAndNext('missed');
        } else if (e.key === '2') {
          e.preventDefault();
          recordScoreAndNext('partial');
        } else if (e.key === '3') {
          e.preventDefault();
          recordScoreAndNext('mastered');
        }
      }
    });

    // Close review modal when clicking on scrim
    const reviewScrimEl = document.getElementById('reviewModalScrim');
    if (reviewScrimEl) {
      reviewScrimEl.addEventListener('click', (e) => {
        if (e.target === reviewScrimEl) closeReviewModal();
      });
    }

    // INIT
    try {
      isAudioMuted = localStorage.getItem('audioMuted') === 'true';
    } catch (e) {}
    updateAudioIconUI();

    if (window.whenPacksReady) {
      window.whenPacksReady(function() {
        initExamEngine();
      });
    } else {
      initExamEngine();
    }
  </script>
</body>
</html>
