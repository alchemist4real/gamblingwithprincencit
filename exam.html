<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#314fba">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>EXAM MODE • GAMBLING WITH PRINCE NCIT</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23314fba'/%3E%3Cpath d='M32 12 C29 20 17 28 17 37 C17 43.5 22.5 47 28 45.8 C27 48.5 24.5 51 22 52 L42 52 C39.5 51 37 48.5 36 45.8 C41.5 47 47 43.5 47 37 C47 28 35 20 32 12 Z' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Special+Elite&display=swap" rel="stylesheet">
  <script src="packs/packs.js"></script>
  <style>
    /* =======================================================
       STRICT MONOCHROMATIC 2-COLOR DESIGN:
       PRIMARY BLUE #314fba & WHITE #ffffff
       STRICT 2 FONTS ONLY:
       1. DISPLAY FONT: 'Special Elite'
       2. BODY & UI FONT: 'Plus Jakarta Sans'
       STRICT ZERO GRADIENTS: PURE SOLID COLORS ONLY
       STRICT ZERO BLACK SHADOWS: NO AI SLOP SHADOWS
       ======================================================= */

    :root {
      --primary: #314fba;
      --primary-dark: #223ca3;
      --primary-deep: #172b7a;
      --white: #ffffff;
      --white-90: rgba(255, 255, 255, 0.90);
      --white-75: rgba(255, 255, 255, 0.75);
      --white-50: rgba(255, 255, 255, 0.50);
      --white-25: rgba(255, 255, 255, 0.25);
      --white-15: rgba(255, 255, 255, 0.15);
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Special Elite', cursive, monospace, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    body, button, input, textarea, select {
      font-family: var(--font-main);
    }

    html, body {
      width: 100vw;
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      background-color: var(--primary);
      color: var(--white);
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(18px, 3.2vh, 36px) clamp(16px, 3vw, 36px) clamp(16px, 2.5vh, 30px);
      box-sizing: border-box;
    }

    /* =======================================================
       CENTERED APP HEADER (MATCHING CASUAL.HTML EXACTLY)
       ======================================================= */
    header.app-header {
      text-align: center;
      width: 100%;
      max-width: 960px;
      flex-shrink: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    h1.main-title,
    h1.main-title *,
    .title-tone-1,
    .title-tone-2 {
      font-family: 'Special Elite', cursive, monospace, sans-serif !important;
    }

    h1.main-title {
      font-size: clamp(1.45rem, 3.2vw, 2.65rem);
      font-weight: normal;
      letter-spacing: clamp(1.5px, 0.4vw, 3px);
      text-transform: uppercase;
      line-height: 1.18;
      margin: 0;
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.5vw, 16px);
      color: var(--primary-deep);
      text-align: center;
      user-select: none;
    }

    .title-tone-1,
    .title-tone-2 {
      color: var(--primary-deep);
      -webkit-text-fill-color: var(--primary-deep);
      -webkit-text-stroke: 5px #ffffff;
      paint-order: stroke fill;
      text-shadow:
        -3px -3px 0 #ffffff,
         3px -3px 0 #ffffff,
        -3px  3px 0 #ffffff,
         3px  3px 0 #ffffff,
        -4px  0   0 #ffffff,
         4px  0   0 #ffffff,
         0   -4px 0 #ffffff,
         0    4px 0 #ffffff,
        -2px -3.5px 0 #ffffff,
          2px -3.5px 0 #ffffff,
        -2px  3.5px 0 #ffffff,
          2px  3.5px 0 #ffffff,
        -3.5px -2px 0 #ffffff,
          3.5px -2px 0 #ffffff,
        -3.5px  2px 0 #ffffff,
          3.5px  2px 0 #ffffff,
          0px  5px 0 rgba(19, 34, 96, 0.7),
          0px  8px 0 rgba(19, 34, 96, 0.4);
      display: inline-block;
      transition: transform 0.2s cubic-bezier(0.16, 1.2, 0.3, 1);
    }
    .title-tone-1:hover {
      transform: translateY(-2px) rotate(-1deg);
    }
    .title-tone-2:hover {
      transform: translateY(-2px) rotate(1deg);
    }

    .sub-meta {
      font-family: var(--font-main);
      font-size: clamp(0.72rem, 1.15vw, 0.82rem);
      font-weight: 700;
      color: var(--white-90);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-top: clamp(6px, 1vh, 10px);
      text-shadow: 0 1px 3px rgba(13, 26, 69, 0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 94vw;
    }

    @media (max-width: 600px) {
      h1.main-title {
        font-size: clamp(1.15rem, 5vw, 1.55rem);
        letter-spacing: 1.2px;
        gap: 6px;
      }
      .title-tone-1,
      .title-tone-2 {
        -webkit-text-stroke: 3.5px #ffffff;
      }
      .sub-meta {
        font-size: 0.68rem;
      }
    }

    /* =======================================================
       MAIN EXAM STAGE ARENA
       ======================================================= */
    .exam-stage-arena {
      width: 100%;
      max-width: 960px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-sizing: border-box;
      z-index: 5;
    }

    /* =======================================================
       COLLECTIBLE HORIZONTAL EXAM CARD (.EXAM-BIG-CARD)
       MATCHING CASUAL.HTML'S .BIG-CARD AESTHETIC & ANATOMY
       ======================================================= */
    .exam-big-card {
      width: 100%;
      height: clamp(320px, 50vh, 460px);
      border-radius: 20px;
      overflow: hidden;
      background-color: var(--white);
      border: 3px solid var(--primary-deep);
      box-shadow: 0 6px 0 var(--primary-deep);
      display: flex;
      flex-direction: row;
      padding: 10px 14px 10px 10px;
      user-select: none;
      position: relative;
      color: var(--primary-deep);
      box-sizing: border-box;
      animation: examCardPop 0.26s cubic-bezier(0.16, 1.25, 0.3, 1);
    }
    @keyframes examCardPop {
      0% { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Left Branding Rail */
    .exam-left-rail {
      width: 28px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2px 0 4px;
      margin-right: 10px;
      position: relative;
    }
    .exam-pip {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background-color: var(--primary);
      border: 2px solid var(--primary-deep);
      flex-shrink: 0;
    }
    .exam-vertical-title {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: normal;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--primary-deep);
      writing-mode: vertical-lr;
      transform: rotate(180deg);
      white-space: nowrap;
      margin-top: auto;
      margin-bottom: auto;
    }

    /* Center Main Area */
    .exam-main-area {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Content Window Frame */
    .exam-content-window {
      flex: 1;
      min-height: 0;
      border-radius: 14px;
      border: 2px solid var(--primary-deep);
      background-color: #0d1a45;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 12px 14px 44px;
      color: var(--white);
      box-sizing: border-box;
    }

    /* =======================================================
       PHASE 1: EXAM SETUP CONFIGURATION VIEW
       ======================================================= */
    .setup-view-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .setup-view-wrap::-webkit-scrollbar {
      width: 4px;
    }
    .setup-view-wrap::-webkit-scrollbar-thumb {
      background-color: var(--white-25);
      border-radius: 999px;
    }

    .setup-section-title {
      font-family: var(--font-display);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--white-90);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .setup-pills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .setup-pill-btn {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--white-25);
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--white);
      font-family: var(--font-main);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.16s ease;
      user-select: none;
    }
    .setup-pill-btn:hover {
      background-color: rgba(255, 255, 255, 0.20);
      transform: translateY(-1px);
    }
    .setup-pill-btn.active {
      background-color: var(--white);
      color: var(--primary-deep);
      border-color: var(--white);
      box-shadow: 0 0 0 2px var(--primary-deep);
    }
    .setup-pill-btn svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.2;
    }

    .setup-protocol-box {
      background-color: rgba(8, 17, 46, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 11px;
      line-height: 1.45;
      color: #e2e8f8;
    }
    .protocol-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .protocol-bullet {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background-color: var(--primary);
      margin-top: 5px;
      flex-shrink: 0;
    }

    /* =======================================================
       PHASE 2: 5S PREPARATION COUNTDOWN VIEW
       ======================================================= */
    .prep-countdown-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
    }
    .prep-countdown-circle {
      width: 90px;
      height: 90px;
      border-radius: 999px;
      background-color: var(--white);
      border: 3.5px solid var(--primary-deep);
      box-shadow: 0 0 0 4px var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary-deep);
      font-family: var(--font-display);
      font-size: 42px;
      font-weight: normal;
      animation: prepPulse 0.9s infinite alternate cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes prepPulse {
      0% { transform: scale(0.94); }
      100% { transform: scale(1.06); }
    }
    .prep-countdown-title {
      font-family: var(--font-display);
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--white);
      text-transform: uppercase;
    }
    .prep-countdown-sub {
      font-size: 12px;
      color: var(--white-75);
    }

    /* =======================================================
       PHASE 3: 60S TIMED STUDY PHASE (SPLIT LAYOUT)
       ======================================================= */
    .study-split-grid {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 12px;
      box-sizing: border-box;
    }

    .study-specimen-pane {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      background-color: #060c22;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .study-specimen-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .study-no-image-text {
      font-family: var(--font-display);
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--white-50);
      text-align: center;
      padding: 16px;
    }

    .study-prompts-pane {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .study-prompts-pane::-webkit-scrollbar {
      width: 4px;
    }
    .study-prompts-pane::-webkit-scrollbar-thumb {
      background-color: var(--white-25);
      border-radius: 999px;
    }

    .study-q-card {
      background-color: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .study-q-number {
      font-family: var(--font-display);
      font-size: 8.5px;
      letter-spacing: 1px;
      background-color: var(--white);
      color: var(--primary-deep);
      border-radius: 4px;
      padding: 1px 5px;
      align-self: flex-start;
      font-weight: 700;
      text-transform: uppercase;
    }
    .study-q-prompt {
      font-size: 11px;
      line-height: 1.35;
      font-weight: 600;
      color: #ffffff;
    }

    /* =======================================================
       PHASE 4: STRUCTURED SPECIMEN REVEAL PHASE
       ======================================================= */
    .reveal-view-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .reveal-view-wrap::-webkit-scrollbar {
      width: 4px;
    }
    .reveal-view-wrap::-webkit-scrollbar-thumb {
      background-color: var(--white-25);
      border-radius: 999px;
    }

    .reveal-diag-header {
      background-color: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .reveal-badge {
      font-family: var(--font-display);
      font-size: 8.5px;
      letter-spacing: 1px;
      background-color: var(--white);
      color: var(--primary-deep);
      border-radius: 4px;
      padding: 1px 6px;
      align-self: flex-start;
      font-weight: 700;
      text-transform: uppercase;
    }
    .reveal-diag-title {
      font-family: var(--font-display);
      font-size: 15px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--white);
      line-height: 1.2;
    }
    .reveal-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 10.5px;
      color: #cfdcf8;
      font-weight: 600;
    }
    .reveal-meta-item {
      background: rgba(255, 255, 255, 0.10);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .reveal-details-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .reveal-block {
      background-color: rgba(8, 17, 46, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .reveal-block-title {
      font-family: var(--font-display);
      font-size: 9.5px;
      letter-spacing: 1px;
      color: var(--white-90);
      text-transform: uppercase;
    }
    .reveal-block-content {
      font-size: 11px;
      line-height: 1.4;
      color: #eef3ff;
    }
    .reveal-bullet-list {
      list-style-type: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .reveal-bullet-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .reveal-bullet-dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background-color: var(--white);
      margin-top: 5px;
      flex-shrink: 0;
    }

    /* Self-Assessment Scoring Row */
    .reveal-scoring-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.20);
      border-radius: 10px;
      padding: 8px 12px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .scoring-label {
      font-family: var(--font-display);
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--white);
    }
    .scoring-buttons-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-score-choice {
      padding: 5px 12px;
      border-radius: 999px;
      border: 1.5px solid var(--white-50);
      background-color: var(--white);
      color: var(--primary-deep);
      font-family: var(--font-main);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      user-select: none;
    }
    .btn-score-choice:hover {
      background-color: var(--primary-deep);
      color: var(--white);
      border-color: var(--white);
      transform: scale(1.04);
    }

    /* =======================================================
       PHASE 5: FINAL PERFORMANCE SUMMARY VIEW
       ======================================================= */
    .summary-view-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 10px;
    }
    .summary-score-badge {
      width: 96px;
      height: 96px;
      border-radius: 999px;
      background-color: var(--white);
      border: 3.5px solid var(--primary-deep);
      box-shadow: 0 0 0 4px var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--primary-deep);
      font-family: var(--font-display);
      font-size: 32px;
      line-height: 1;
      font-weight: normal;
    }
    .summary-score-sub {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--primary-deep);
      margin-top: 2px;
    }
    .summary-title {
      font-family: var(--font-display);
      font-size: 18px;
      letter-spacing: 2px;
      color: var(--white);
      text-transform: uppercase;
    }
    .summary-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 440px;
    }
    .summary-stat-box {
      background-color: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.20);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-box-val {
      font-family: var(--font-display);
      font-size: 18px;
      color: var(--white);
    }
    .stat-box-lbl {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--white-75);
      text-transform: uppercase;
    }

    /* =======================================================
       BOTTOM OVERLAPPING BANNER (MATCHING CASUAL.HTML)
       ======================================================= */
    .exam-bottom-banner {
      position: absolute;
      bottom: 4px;
      left: -14px;
      right: 0;
      height: 42px;
      background-color: var(--primary);
      border: 2px solid var(--primary-deep);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 46px;
      z-index: 10;
    }

    .exam-emblem-badge {
      position: absolute;
      left: -4px;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background-color: var(--white);
      border: 2.5px solid var(--primary-deep);
      box-shadow: 0 0 0 2px var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 15;
    }
    .exam-emblem-icon {
      width: 22px;
      height: 22px;
      color: var(--primary-deep);
    }

    .exam-banner-title {
      font-family: var(--font-display);
      font-size: 13.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--white);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Timer Ring Box */
    .exam-timer-ring-box {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--white);
      border: 1.5px solid var(--primary-deep);
      border-radius: 999px;
      padding: 2px 10px 2px 6px;
      color: var(--primary-deep);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .timer-svg-circle {
      width: 20px;
      height: 20px;
      transform: rotate(-90deg);
    }
    .timer-svg-bg {
      fill: none;
      stroke: #d0d8f0;
      stroke-width: 3;
    }
    .timer-svg-progress {
      fill: none;
      stroke: var(--primary-deep);
      stroke-width: 3;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.9s linear;
    }

    .exam-banner-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .exam-action-btn {
      padding: 5px 12px;
      border-radius: 999px;
      background-color: var(--white);
      color: var(--primary-deep);
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      border: 1.5px solid var(--primary-deep);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
      user-select: none;
    }
    .exam-action-btn:hover {
      background-color: var(--primary-deep);
      color: var(--white);
      border-color: var(--white);
      transform: scale(1.04);
    }
    .exam-action-btn svg {
      width: 12px;
      height: 12px;
      stroke-width: 2.5;
    }

    @media (max-width: 768px) {
      .study-split-grid {
        grid-template-columns: 1fr;
      }
      .study-specimen-pane {
        height: 160px;
      }
      .exam-big-card {
        height: clamp(340px, 60vh, 520px);
      }
    }

    /* =======================================================
       SOLID & CONSOLIDATED CONSOLE DOCK (MATCHING CASUAL.HTML)
       ======================================================= */
    .bottom-player-bar {
      width: auto;
      max-width: fit-content;
      height: 56px;
      border: 3px solid var(--primary-deep);
      border-radius: 999px;
      background-color: var(--white);
      padding: 5px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 0 var(--primary-deep);
      flex-shrink: 0;
      z-index: 100;
      margin: 0 auto;
    }

    .dock-section {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .dock-round-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 999px;
      border: 2px solid var(--primary-deep);
      background-color: #f6f8fe;
      color: var(--primary-deep);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
    }
    .dock-round-btn:hover {
      background-color: var(--primary-deep);
      color: var(--white);
      transform: scale(1.08);
    }
    .dock-round-btn svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.2;
    }
    .dock-round-btn.is-muted {
      opacity: 0.65;
      border-style: dashed;
    }

    .dock-track-info {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 14px;
      background-color: #f6f8fe;
      border: 2px solid var(--primary-deep);
      border-radius: 999px;
      user-select: none;
    }
    .dock-track-count {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--primary-deep);
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .dock-pill-btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      border: 2px solid var(--primary-deep);
      background-color: #f6f8fe;
      color: var(--primary-deep);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }
    .dock-pill-btn:hover {
      background-color: var(--primary-deep);
      color: var(--white);
      transform: scale(1.04);
    }
    .dock-pill-btn svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.2;
    }

    /* =======================================================
       TOAST SYSTEM & FULL-SCREEN SCRIM (MATCHING CASUAL.HTML)
       ======================================================= */
    .screen-scrim {
      position: fixed;
      inset: 0;
      background: rgba(10, 20, 65, 0.65);
      z-index: 3400;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(2.5px);
      -webkit-backdrop-filter: blur(2.5px);
    }
    body.toast-active .screen-scrim {
      opacity: 1;
      pointer-events: auto;
    }

    .toast-container {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      width: 90%;
      max-width: 440px;
    }
    .toast-pill {
      background-color: var(--white);
      color: var(--primary-deep);
      border: 2.5px solid var(--primary-deep);
      box-shadow: 0 4px 0 var(--primary-deep);
      border-radius: 999px;
      padding: 8px 18px;
      font-family: var(--font-main);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(-12px);
      transition: all 0.22s cubic-bezier(0.16, 1.25, 0.3, 1);
      pointer-events: auto;
    }
    .toast-pill.active {
      opacity: 1;
      transform: translateY(0);
    }
    .toast-pill svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.4;
      color: var(--primary);
    }
  </style>
</head>
<body>

  <!-- FULL SCREEN SCRIM -->
  <div class="screen-scrim" id="screenScrim"></div>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- CENTERED APP HEADER -->
  <header class="app-header">
    <div class="title-row">
      <h1 class="main-title">
        <span class="title-tone-1">EXAM MODE</span>
        <span class="title-tone-2">PRINCE NCIT</span>
      </h1>
    </div>
    <div class="sub-meta" id="examSubMeta">PRACTICAL EXAM SIMULATION // 60S SPECIMEN IDENTIFICATION</div>
  </header>

  <!-- MAIN EXAM ARENA -->
  <main class="exam-stage-arena" id="examStageArena">
    <!-- Dynamically rendered according to currentExamPhase -->
  </main>

  <!-- SOLID & CONSOLIDATED CONSOLE DOCK -->
  <footer class="bottom-player-bar">
    <div class="dock-section dock-left">
      <a href="index.html" class="dock-round-btn" id="btnDockLobby" title="Return to Lobby [Esc]">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </a>
      <button class="dock-round-btn" id="btnAudioToggle" onclick="toggleAudioMute()" title="Toggle Sound [M]">
        <svg id="iconAudioOn" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        <svg id="iconAudioOff" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="23" y1="9" x2="17" y2="15"/>
          <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>
    </div>

    <div class="dock-section dock-center">
      <div class="dock-track-info">
        <span class="dock-track-count" id="dockExamStatus">EXAM CONFIGURATION</span>
      </div>
    </div>

    <div class="dock-section dock-right" id="dockActionGroup">
      <!-- Dynamic contextual action button -->
    </div>
  </footer>

  <!-- EXAM SCRIPT & ENGINE -->
  <script>
    // =======================================================
    // EXAM STATE & ENGINE
    // =======================================================
    let selectedPackIds = [];
    let ALL_EXAM_CARDS = [];
    let examActiveFilter = 'all';
    let examTargetCount = 20; // 5, 10, 20, or 'all'

    // Exam Flow Phases: 'setup', 'prep', 'study', 'reveal', 'summary'
    let currentExamPhase = 'setup';
    let examSessionCards = [];
    let currentCardIndex = 0;
    let prepTimer = null;
    let prepRemaining = 5;
    let studyTimer = null;
    let studyRemaining = 60;
    let isTimerPaused = false;

    // Scoring
    let examScores = {
      mastered: 0,
      partial: 0,
      missed: 0,
      totalPoints: 0
    };

    // Audio & Toast
    let isAudioMuted = false;
    let audioCtx = null;
    let toastTimer = null;

    // Load Decks from Lobby Selection
    function initExamEngine() {
      const packs = window.CARD_PACKS || {};
      const allPackKeys = Object.keys(packs);

      try {
        const stored = localStorage.getItem('selectedCardPacks');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) {
            selectedPackIds = parsed.filter(id => packs[id]);
          }
        }
      } catch (e) {}

      if (!selectedPackIds || selectedPackIds.length === 0) {
        selectedPackIds = allPackKeys.length > 0 ? [...allPackKeys] : [];
      }

      // Merge cards from selected packs
      let combined = [];
      selectedPackIds.forEach(pId => {
        const p = packs[pId];
        if (p && p.cards) {
          p.cards.forEach(c => {
            combined.push({
              ...c,
              _packId: pId,
              _packName: p.packName || pId,
              _packBadge: p.badge || 'PACK'
            });
          });
        }
      });

      ALL_EXAM_CARDS = combined;

      // Update Sub-Meta
      const subMeta = document.getElementById('examSubMeta');
      if (subMeta) {
        const packNames = selectedPackIds.map(id => packs[id]?.badge || packs[id]?.packName || id).join(' + ');
        subMeta.textContent = `${packNames} // ${ALL_EXAM_CARDS.length} SPECIMENS READY`;
      }

      renderCurrentPhase();
    }

    // =======================================================
    // PHASE RENDER ROUTER
    // =======================================================
    function renderCurrentPhase() {
      const arena = document.getElementById('examStageArena');
      if (!arena) return;

      if (currentExamPhase === 'setup') {
        renderSetupPhase(arena);
      } else if (currentExamPhase === 'prep') {
        renderPrepPhase(arena);
      } else if (currentExamPhase === 'study') {
        renderStudyPhase(arena);
      } else if (currentExamPhase === 'reveal') {
        renderRevealPhase(arena);
      } else if (currentExamPhase === 'summary') {
        renderSummaryPhase(arena);
      }

      updateDockUI();
    }

    // 1. SETUP PHASE
    function renderSetupPhase(container) {
      const packs = window.CARD_PACKS || {};
      const prepCount = ALL_EXAM_CARDS.filter(c => c.type === 'preparat').length;
      const teoriCount = ALL_EXAM_CARDS.filter(c => c.type === 'teori').length;
      const totalCount = ALL_EXAM_CARDS.length;

      container.innerHTML = `
        <div class="exam-big-card">
          <div class="exam-left-rail">
            <div class="exam-pip"></div>
            <div class="exam-vertical-title">EXAM SETUP // CONFIGURATION</div>
            <div class="exam-pip"></div>
          </div>
          <div class="exam-main-area">
            <div class="exam-content-window">
              <div class="setup-view-wrap">
                
                <!-- Section 1: Target Content Filter -->
                <div class="setup-section-title">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                  <span>1. CHOOSE CONTENT FILTER</span>
                </div>
                <div class="setup-pills-row">
                  <button class="setup-pill-btn ${examActiveFilter === 'all' ? 'active' : ''}" onclick="setExamFilter('all')">
                    <span>All Questions (${totalCount})</span>
                  </button>
                  <button class="setup-pill-btn ${examActiveFilter === 'preparat' ? 'active' : ''}" onclick="setExamFilter('preparat')">
                    <span>Histopathology (${prepCount})</span>
                  </button>
                  <button class="setup-pill-btn ${examActiveFilter === 'teori' ? 'active' : ''}" onclick="setExamFilter('teori')">
                    <span>Theory & Cases (${teoriCount})</span>
                  </button>
                </div>

                <!-- Section 2: Question Count Selector -->
                <div class="setup-section-title" style="margin-top: 6px;">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                  <span>2. SELECT QUESTION COUNT</span>
                </div>
                <div class="setup-pills-row">
                  <button class="setup-pill-btn ${examTargetCount === 5 ? 'active' : ''}" onclick="setExamCount(5)">
                    <span>5 Questions</span>
                  </button>
                  <button class="setup-pill-btn ${examTargetCount === 10 ? 'active' : ''}" onclick="setExamCount(10)">
                    <span>10 Questions</span>
                  </button>
                  <button class="setup-pill-btn ${examTargetCount === 20 ? 'active' : ''}" onclick="setExamCount(20)">
                    <span>20 Questions</span>
                  </button>
                  <button class="setup-pill-btn ${examTargetCount === 'all' ? 'active' : ''}" onclick="setExamCount('all')">
                    <span>All Available (${totalCount})</span>
                  </button>
                </div>

                <!-- Section 3: Protocol Rules -->
                <div class="setup-section-title" style="margin-top: 6px;">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                  <span>EXAM SIMULATION PROTOCOL</span>
                </div>
                <div class="setup-protocol-box">
                  <div class="protocol-item">
                    <div class="protocol-bullet"></div>
                    <div><strong>5-Second Preparation:</strong> Brief tactile countdown before each specimen is shown.</div>
                  </div>
                  <div class="protocol-item">
                    <div class="protocol-bullet"></div>
                    <div><strong>60-Second Timed Study:</strong> Inspect specimen and answer the 4 universal identification prompts.</div>
                  </div>
                  <div class="protocol-item">
                    <div class="protocol-bullet"></div>
                    <div><strong>Structured Reveal:</strong> Instant diagnostic answer, key features, and self-assessment scoring.</div>
                  </div>
                </div>

              </div>
            </div>

            <div class="exam-bottom-banner">
              <div class="exam-emblem-badge">
                <svg class="exam-emblem-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
              </div>
              <div class="exam-banner-title">READY TO SIMULATE</div>
              <div class="exam-banner-actions">
                <button class="exam-action-btn" onclick="startExamSession()">
                  <span>START EXAM [Enter]</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // 2. PREPARATION COUNTDOWN PHASE (5S)
    function renderPrepPhase(container) {
      container.innerHTML = `
        <div class="exam-big-card">
          <div class="exam-left-rail">
            <div class="exam-pip"></div>
            <div class="exam-vertical-title">PREPARATION // GET READY</div>
            <div class="exam-pip"></div>
          </div>
          <div class="exam-main-area">
            <div class="exam-content-window">
              <div class="prep-countdown-wrap">
                <div class="prep-countdown-circle" id="prepCounterEl">${prepRemaining}</div>
                <div class="prep-countdown-title">PREPARE FOR SPECIMEN #${currentCardIndex + 1}</div>
                <div class="prep-countdown-sub">Study begins in ${prepRemaining} seconds...</div>
              </div>
            </div>

            <div class="exam-bottom-banner">
              <div class="exam-emblem-badge">
                <svg class="exam-emblem-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <polyline points="12 6 12 12 16 14"/>
                </svg>
              </div>
              <div class="exam-banner-title">PREPARATION PHASE</div>
              <div class="exam-banner-actions">
                <button class="exam-action-btn" onclick="skipPrepToStudy()">
                  <span>SKIP PREP [Enter]</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // 3. STUDY PHASE (60S) WITH 4 UNIVERSAL QUESTIONS
    function renderStudyPhase(container) {
      const card = examSessionCards[currentCardIndex] || {};
      const total = examSessionCards.length;
      const progressOffset = ((60 - studyRemaining) / 60) * 56.5;

      container.innerHTML = `
        <div class="exam-big-card">
          <div class="exam-left-rail">
            <div class="exam-pip"></div>
            <div class="exam-vertical-title">SPECIMEN ${currentCardIndex + 1} OF ${total}</div>
            <div class="exam-pip"></div>
          </div>
          <div class="exam-main-area">
            <div class="exam-content-window">
              <div class="study-split-grid">
                
                <!-- Left: Specimen High-Res Visual -->
                <div class="study-specimen-pane">
                  ${card.image ? `
                    <img src="${card.image}" alt="Specimen ${card.id}" class="study-specimen-img" />
                  ` : `
                    <div class="study-no-image-text">
                      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin: 0 auto 8px; display: block; opacity: 0.6;"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                      <div>THEORETICAL CASE VIGNETTE</div>
                      <div style="font-size: 11px; margin-top: 4px; color: #a4b7e8;">${card.prompt || 'Analyze theoretical case details.'}</div>
                    </div>
                  `}
                </div>

                <!-- Right: The 4 Universal Identification Prompts -->
                <div class="study-prompts-pane">
                  <div class="study-q-card">
                    <span class="study-q-number">SOAL 1 // IDENTIFIKASI</span>
                    <div class="study-q-prompt">Preparat apa ini? Tentukan nama diagnosis atau sediaan patologi.</div>
                  </div>

                  <div class="study-q-card">
                    <span class="study-q-number">SOAL 2 // STRUKTUR KHAS</span>
                    <div class="study-q-prompt">Sel apa yang menjadi ciri khas pada struktur ini? Sebutkan penanda mikroskopisnya.</div>
                  </div>

                  <div class="study-q-card">
                    <span class="study-q-number">SOAL 3 // CIRI UTAMA</span>
                    <div class="study-q-prompt">Apa ciri-ciri utama sediaan ini? Deskripsikan pola arsitektur atau stroma.</div>
                  </div>

                  <div class="study-q-card">
                    <span class="study-q-number">SOAL 4 // PATOFISIOLOGI</span>
                    <div class="study-q-prompt">Fungsi atau signifikansi biologis / patogenesis apa yang mendasari kelainan ini?</div>
                  </div>
                </div>

              </div>
            </div>

            <div class="exam-bottom-banner">
              <div class="exam-emblem-badge">
                <svg class="exam-emblem-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <polyline points="12 6 12 12 16 14"/>
                </svg>
              </div>
              <div class="exam-banner-title">SPECIMEN #${currentCardIndex + 1}</div>
              
              <div class="exam-banner-actions">
                <!-- 60s Animated SVG Timer Ring -->
                <div class="exam-timer-ring-box" id="studyTimerRingBox" title="Pause / Resume [Space]" onclick="toggleStudyTimerPause()">
                  <svg class="timer-svg-circle" viewBox="0 0 24 24">
                    <circle class="timer-svg-bg" cx="12" cy="12" r="9"/>
                    <circle class="timer-svg-progress" id="timerSvgProgress" cx="12" cy="12" r="9" stroke-dasharray="56.5" stroke-dashoffset="${progressOffset}"/>
                  </svg>
                  <span id="studySecondsEl">${studyRemaining}s</span>
                </div>

                <button class="exam-action-btn" onclick="revealCurrentAnswer()">
                  <span>REVEAL [Enter]</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // 4. STRUCTURED REVEAL PHASE
    function renderRevealPhase(container) {
      const card = examSessionCards[currentCardIndex] || {};
      const total = examSessionCards.length;

      // Extract key findings
      const rawCiri = card.struktur_khas || card.ciri_kunci || card.mikroskopis || [];
      const ciriList = Array.isArray(rawCiri) ? rawCiri : [rawCiri];

      const rawEtiologi = card.etiologi || card.mekanisme || '';
      const etiologiText = Array.isArray(rawEtiologi) ? rawEtiologi.join(' • ') : rawEtiologi;

      container.innerHTML = `
        <div class="exam-big-card">
          <div class="exam-left-rail">
            <div class="exam-pip"></div>
            <div class="exam-vertical-title">REVEAL // DIAGNOSTIC SPEC SHEET</div>
            <div class="exam-pip"></div>
          </div>
          <div class="exam-main-area">
            <div class="exam-content-window">
              <div class="reveal-view-wrap">
                
                <!-- Diagnosis Header -->
                <div class="reveal-diag-header">
                  <span class="reveal-badge">DIAGNOSIS UTAMA</span>
                  <div class="reveal-diag-title">${card.diagnosis || 'Diagnosis Sediaan'}</div>
                  <div class="reveal-meta-row">
                    <span class="reveal-meta-item">📍 ${card.organ || 'Organ Asal'}</span>
                    <span class="reveal-meta-item">🏷️ ${card.sifat || 'Klasifikasi Patologi'}</span>
                    ${card.asal ? `<span class="reveal-meta-item">🔬 ${card.asal}</span>` : ''}
                  </div>
                </div>

                <!-- Details & Microscopic Findings -->
                <div class="reveal-details-box">
                  <div class="reveal-block">
                    <span class="reveal-block-title">CIRI KHAS HISTOPATOLOGIS</span>
                    <ul class="reveal-bullet-list">
                      ${ciriList.map(item => `
                        <li class="reveal-bullet-item">
                          <div class="reveal-bullet-dot"></div>
                          <div class="reveal-block-content">${item}</div>
                        </li>
                      `).join('')}
                    </ul>
                  </div>

                  ${etiologiText ? `
                    <div class="reveal-block">
                      <span class="reveal-block-title">ETIOLOGI & PATOFISIOLOGI</span>
                      <div class="reveal-block-content">${etiologiText}</div>
                    </div>
                  ` : ''}

                  ${card.keywords ? `
                    <div class="reveal-block">
                      <span class="reveal-block-title">KATA KUNCI CEPAT (HIGH-YIELD)</span>
                      <div class="reveal-block-content"><strong>${card.keywords}</strong></div>
                    </div>
                  ` : ''}
                </div>

                <!-- Self-Assessment Scoring Choice -->
                <div class="reveal-scoring-row">
                  <span class="scoring-label">HOW WELL DID YOU KNOW THIS?</span>
                  <div class="scoring-buttons-group">
                    <button class="btn-score-choice" onclick="recordScoreAndNext('missed')" title="Key [1]">
                      <span>0 • MISSED [1]</span>
                    </button>
                    <button class="btn-score-choice" onclick="recordScoreAndNext('partial')" title="Key [2]">
                      <span>1 • PARTIAL [2]</span>
                    </button>
                    <button class="btn-score-choice" onclick="recordScoreAndNext('mastered')" title="Key [3]">
                      <span>2 • MASTERED [3]</span>
                    </button>
                  </div>
                </div>

              </div>
            </div>

            <div class="exam-bottom-banner">
              <div class="exam-emblem-badge">
                <svg class="exam-emblem-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </div>
              <div class="exam-banner-title">SPECIMEN #${currentCardIndex + 1} REVEALED</div>
              <div class="exam-banner-actions">
                <button class="exam-action-btn" onclick="recordScoreAndNext('mastered')">
                  <span>NEXT SPECIMEN [Enter]</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // 5. SUMMARY PHASE
    function renderSummaryPhase(container) {
      const totalCards = examSessionCards.length;
      const maxPoints = totalCards * 2;
      const pct = maxPoints > 0 ? Math.round((examScores.totalPoints / maxPoints) * 100) : 0;

      container.innerHTML = `
        <div class="exam-big-card">
          <div class="exam-left-rail">
            <div class="exam-pip"></div>
            <div class="exam-vertical-title">SIMULATION COMPLETE // SCORECARD</div>
            <div class="exam-pip"></div>
          </div>
          <div class="exam-main-area">
            <div class="exam-content-window">
              <div class="summary-view-wrap">
                <div class="summary-score-badge">
                  <span>${pct}%</span>
                  <span class="summary-score-sub">${examScores.totalPoints}/${maxPoints} PTS</span>
                </div>
                <div class="summary-title">SIMULATION PERFORMANCE SUMMARY</div>
                
                <div class="summary-stats-grid">
                  <div class="summary-stat-box">
                    <span class="stat-box-val" style="color: #ffffff;">${examScores.mastered}</span>
                    <span class="stat-box-lbl">Mastered (100%)</span>
                  </div>
                  <div class="summary-stat-box">
                    <span class="stat-box-val" style="color: #ffffff;">${examScores.partial}</span>
                    <span class="stat-box-lbl">Partial (50%)</span>
                  </div>
                  <div class="summary-stat-box">
                    <span class="stat-box-val" style="color: #ffffff;">${examScores.missed}</span>
                    <span class="stat-box-lbl">Missed (0%)</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="exam-bottom-banner">
              <div class="exam-emblem-badge">
                <svg class="exam-emblem-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                  <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
              </div>
              <div class="exam-banner-title">EXAM FINISHED</div>
              <div class="exam-banner-actions">
                <button class="exam-action-btn" onclick="restartExamSimulation()">
                  <span>REPLAY EXAM [Enter]</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
                <a href="index.html" class="exam-action-btn" style="text-decoration:none;">
                  <span>LOBBY [Esc]</span>
                </a>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =======================================================
    // EXAM INTERACTIONS & TIMERS
    // =======================================================
    function setExamFilter(filterType) {
      playClickSound();
      examActiveFilter = filterType;
      renderCurrentPhase();
    }

    function setExamCount(countVal) {
      playClickSound();
      examTargetCount = countVal;
      renderCurrentPhase();
    }

    function startExamSession() {
      playLaunchSound();
      // Filter cards
      let pool = [];
      if (examActiveFilter === 'all') {
        pool = [...ALL_EXAM_CARDS];
      } else {
        pool = ALL_EXAM_CARDS.filter(c => c.type === examActiveFilter);
      }

      if (pool.length === 0) {
        showToast('Notice', 'No specimens match the chosen filter.');
        playErrorSound();
        return;
      }

      // Shuffle pool
      pool = shuffleArray(pool);

      // Slice target count
      if (examTargetCount !== 'all' && typeof examTargetCount === 'number') {
        examSessionCards = pool.slice(0, examTargetCount);
      } else {
        examSessionCards = pool;
      }

      currentCardIndex = 0;
      examScores = { mastered: 0, partial: 0, missed: 0, totalPoints: 0 };

      showToast('Exam Started', `${examSessionCards.length} specimens queued.`);
      startPrepCountdown();
    }

    function startPrepCountdown() {
      currentExamPhase = 'prep';
      prepRemaining = 5;
      renderCurrentPhase();
      playTickSound();

      if (prepTimer) clearInterval(prepTimer);
      prepTimer = setInterval(() => {
        prepRemaining--;
        if (prepRemaining > 0) {
          playTickSound();
          const el = document.getElementById('prepCounterEl');
          if (el) el.textContent = prepRemaining;
        } else {
          clearInterval(prepTimer);
          prepTimer = null;
          startStudyCountdown();
        }
      }, 1000);
    }

    function skipPrepToStudy() {
      if (prepTimer) clearInterval(prepTimer);
      prepTimer = null;
      startStudyCountdown();
    }

    function startStudyCountdown() {
      currentExamPhase = 'study';
      studyRemaining = 60;
      isTimerPaused = false;
      renderCurrentPhase();
      playTone(520, 'sine', 0.12);

      if (studyTimer) clearInterval(studyTimer);
      studyTimer = setInterval(() => {
        if (isTimerPaused) return;

        studyRemaining--;
        const secEl = document.getElementById('studySecondsEl');
        const progressEl = document.getElementById('timerSvgProgress');
        if (secEl) secEl.textContent = `${studyRemaining}s`;
        if (progressEl) {
          const offset = ((60 - studyRemaining) / 60) * 56.5;
          progressEl.setAttribute('stroke-dashoffset', offset);
        }

        if (studyRemaining <= 5 && studyRemaining > 0) {
          playWarningTick();
        }

        if (studyRemaining <= 0) {
          clearInterval(studyTimer);
          studyTimer = null;
          revealCurrentAnswer();
        }
      }, 1000);
    }

    function toggleStudyTimerPause() {
      isTimerPaused = !isTimerPaused;
      showToast('Timer', isTimerPaused ? 'Timer Paused' : 'Timer Resumed');
      const box = document.getElementById('studyTimerRingBox');
      if (box) {
        box.style.opacity = isTimerPaused ? '0.6' : '1';
      }
    }

    function revealCurrentAnswer() {
      if (studyTimer) clearInterval(studyTimer);
      studyTimer = null;
      playRevealSound();
      currentExamPhase = 'reveal';
      renderCurrentPhase();
    }

    function recordScoreAndNext(choice) {
      playSelectSound();
      if (choice === 'mastered') {
        examScores.mastered++;
        examScores.totalPoints += 2;
      } else if (choice === 'partial') {
        examScores.partial++;
        examScores.totalPoints += 1;
      } else {
        examScores.missed++;
      }

      currentCardIndex++;
      if (currentCardIndex < examSessionCards.length) {
        startPrepCountdown();
      } else {
        finishExamSession();
      }
    }

    function finishExamSession() {
      currentExamPhase = 'summary';
      playChimeSound();
      renderCurrentPhase();
    }

    function restartExamSimulation() {
      currentExamPhase = 'setup';
      renderCurrentPhase();
    }

    function updateDockUI() {
      const statusEl = document.getElementById('dockExamStatus');
      const actionGroup = document.getElementById('dockActionGroup');
      if (!statusEl || !actionGroup) return;

      if (currentExamPhase === 'setup') {
        statusEl.textContent = 'EXAM CONFIGURATION';
        actionGroup.innerHTML = `
          <button class="dock-pill-btn" onclick="startExamSession()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span>START [Enter]</span>
          </button>
        `;
      } else if (currentExamPhase === 'prep') {
        statusEl.textContent = `PREPARING SPECIMEN ${currentCardIndex + 1} / ${examSessionCards.length}`;
        actionGroup.innerHTML = `
          <button class="dock-pill-btn" onclick="skipPrepToStudy()">
            <span>SKIP PREP [Enter]</span>
          </button>
        `;
      } else if (currentExamPhase === 'study') {
        statusEl.textContent = `STUDYING: ${currentCardIndex + 1} / ${examSessionCards.length} (${studyRemaining}s)`;
        actionGroup.innerHTML = `
          <button class="dock-pill-btn" onclick="revealCurrentAnswer()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"/></svg>
            <span>REVEAL [Enter]</span>
          </button>
        `;
      } else if (currentExamPhase === 'reveal') {
        statusEl.textContent = `REVEALED: ${currentCardIndex + 1} / ${examSessionCards.length}`;
        actionGroup.innerHTML = `
          <button class="dock-pill-btn" onclick="recordScoreAndNext('mastered')">
            <span>NEXT [Enter]</span>
          </button>
        `;
      } else if (currentExamPhase === 'summary') {
        statusEl.textContent = 'SIMULATION FINISHED';
        actionGroup.innerHTML = `
          <button class="dock-pill-btn" onclick="restartExamSimulation()">
            <span>REPLAY [Enter]</span>
          </button>
        `;
      }
    }

    function shuffleArray(arr) {
      const clone = [...arr];
      for (let i = clone.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [clone[i], clone[j]] = [clone[j], clone[i]];
      }
      return clone;
    }

    // =======================================================
    // TACTILE WEB AUDIO SYNTHESIZER (MATCHING CASUAL.HTML)
    // =======================================================
    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleAudioMute() {
      isAudioMuted = !isAudioMuted;
      try {
        localStorage.setItem('audioMuted', isAudioMuted ? 'true' : 'false');
      } catch (e) {}
      updateAudioIconUI();
      if (!isAudioMuted) {
        initAudioContext();
        playSelectSound();
        showToast('Audio', 'Sound Effects Enabled');
      } else {
        showToast('Audio', 'Sound Effects Muted');
      }
    }

    function updateAudioIconUI() {
      const onIcon = document.getElementById('iconAudioOn');
      const offIcon = document.getElementById('iconAudioOff');
      const btn = document.getElementById('btnAudioToggle');
      if (onIcon && offIcon) {
        onIcon.style.display = isAudioMuted ? 'none' : 'block';
        offIcon.style.display = isAudioMuted ? 'block' : 'none';
      }
      if (btn) {
        btn.classList.toggle('is-muted', isAudioMuted);
      }
    }

    function playTone(freq, type, duration) {
      if (isAudioMuted) return;
      initAudioContext();
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playClickSound() {
      playTone(620, 'triangle', 0.05);
    }

    function playSelectSound() {
      playTone(880, 'sine', 0.08);
    }

    function playLaunchSound() {
      playTone(720, 'triangle', 0.16);
    }

    function playTickSound() {
      playTone(440, 'triangle', 0.04);
    }

    function playWarningTick() {
      playTone(330, 'sawtooth', 0.07);
    }

    function playRevealSound() {
      playTone(660, 'sine', 0.14);
    }

    function playChimeSound() {
      playTone(659, 'sine', 0.10);
      setTimeout(() => playTone(987, 'sine', 0.16), 80);
    }

    function playErrorSound() {
      playTone(160, 'sawtooth', 0.14);
    }

    // =======================================================
    // TOAST NOTIFICATIONS
    // =======================================================
    function showToast(title, message) {
      const container = document.getElementById('toastContainer');
      if (!container) return;

      container.innerHTML = `
        <div class="toast-pill active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
          <span><strong>${title}:</strong> ${message}</span>
        </div>
      `;

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        container.innerHTML = '';
      }, 2400);
    }

    // =======================================================
    // KEYBOARD SHORTCUTS
    // =======================================================
    window.addEventListener('keydown', (e) => {
      // Esc: Return to Lobby
      if (e.key === 'Escape') {
        e.preventDefault();
        window.location.href = 'index.html';
        return;
      }

      // M: Audio Mute
      if (e.key === 'm' || e.key === 'M') {
        e.preventDefault();
        toggleAudioMute();
        return;
      }

      // Enter
      if (e.key === 'Enter') {
        e.preventDefault();
        if (currentExamPhase === 'setup') startExamSession();
        else if (currentExamPhase === 'prep') skipPrepToStudy();
        else if (currentExamPhase === 'study') revealCurrentAnswer();
        else if (currentExamPhase === 'reveal') recordScoreAndNext('mastered');
        else if (currentExamPhase === 'summary') restartExamSimulation();
        return;
      }

      // Space: Pause/Resume Study Timer
      if (e.key === ' ') {
        if (currentExamPhase === 'study') {
          e.preventDefault();
          toggleStudyTimerPause();
        }
        return;
      }

      // Numbers in Reveal Phase (1: Missed, 2: Partial, 3: Mastered)
      if (currentExamPhase === 'reveal') {
        if (e.key === '1') {
          e.preventDefault();
          recordScoreAndNext('missed');
        } else if (e.key === '2') {
          e.preventDefault();
          recordScoreAndNext('partial');
        } else if (e.key === '3') {
          e.preventDefault();
          recordScoreAndNext('mastered');
        }
      }
    });

    // INIT
    try {
      isAudioMuted = localStorage.getItem('audioMuted') === 'true';
    } catch (e) {}
    updateAudioIconUI();
    initExamEngine();
  </script>
</body>
